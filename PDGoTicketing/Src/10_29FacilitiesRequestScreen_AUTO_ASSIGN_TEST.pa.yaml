Screens:
  10_29FacilitiesRequestScreen_AUTO_ASSIGN_TEST:
    Properties:
      Fill: =RGBA(248, 249, 252, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varResetAttachments, false);
        Set(varShowSubmitErrors, false);
        NewForm(FacilitiesRequestForm_1);
        ResetForm(FacilitiesRequestForm_1)
    Children:
      - FacilitiesHeaderBarRectangle_1:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: =RGBA(0, 120, 212, 1)
            FocusedBorderThickness: =4
            Height: =64
            HoverFill: =RGBA(0, 120, 212, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            Width: =Parent.Width
      - FacilitiesRequestTitleLabel_1:
          Control: Label
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =24
            Text: ="Submit a Facility Request"
            Width: =Parent.Width
      - FacilitiesBackToHomeButton_1:
          Control: Classic/Button
          Properties:
            BorderColor: =RGBA(210, 220, 230, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =1
            Color: =RGBA(0, 120, 212, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: =Navigate('Pdgo Hub', ScreenTransition.Fade)
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Text: ="← Back to Home"
            Width: =200
            X: |
              =24
            Y: =FacilitiesRequestTitleLabel_1.Y + FacilitiesRequestTitleLabel_1.Height + 8
      - FacilitiesFormBackgroundRectangle_1:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(218, 225, 233, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =1
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =4
            Height: =FacilitiesRequestForm_1.Height + 76
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            Width: =FacilitiesRequestForm_1.Width + 32
            X: =FacilitiesRequestForm_1.X - 16
            Y: =FacilitiesRequestForm_1.Y - 12
      - FacilitiesRequestForm_1:
          Control: Form
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            DataSource: =AdministrativeServiceRequests
            DefaultMode: =FormMode.New
            Height: =Max(200, Parent.Height - Self.Y - 100)
            NumberOfColumns: =1
            OnFailure: |
              =Notify(
                  "Submission failed: " & FacilitiesRequestForm_1.Error,
                  NotificationType.Error
              )
            OnSuccess: |-
              =Set(
                  SubmittedRequestID,
                  FacilitiesRequestForm_1.LastSubmit.ID
              );

              Notify(
                  "Your request has been submitted successfully!",
                  NotificationType.Success
              );

              ResetForm(FacilitiesRequestForm_1);

              NewForm(FacilitiesRequestForm_1)
            Width: =Min(800, Parent.Width - 48)
            X: =(Parent.Width - Self.Width) / 2
            Y: =FacilitiesBackToHomeButton_1.Y + FacilitiesBackToHomeButton_1.Height + 24
          Children:
