      - FacilitiesSubmitRequestButton_1:
          Control: Classic/Button
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            Height: |
              =44
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 95, 175, 1)
            OnSelect: |-
              =Set(varShowSubmitErrors, true);

              If(
                  IsBlank(DataCardValue13.Selected.Value),
                  Notify(
                      "Please select a Service Subcategory.",
                      NotificationType.Error
                  ),

                  DataCardValue13.Selected.Value = "Parking Request" &&
                  IsBlank(FacilitiesParkingLocationDropdown_1.Selected.Value),
                  Notify(
                      "Please select a Parking Location.",
                      NotificationType.Error
                  ),

                  DataCardValue13.Selected.Value = "Building Maintenance" &&
                  IsBlank(FacilitiesRequestTypeDropdown_1.Selected.Value),
                  Notify(
                      "Please select a Request Type.",
                      NotificationType.Error
                  ),

                  SubmitForm(FacilitiesRequestForm_1)
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 75, 145, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Submit Request"
            Visible: |-
              =!(
                  DataCardValue13.Selected.Value = "Parking Request" &&
                  FacilitiesParkingLocationDropdown_1.Selected.Value = "Other parking locations (free)"
              )
            Width: =180
            X: |-
              =FacilitiesRequestForm_1.X +
              (FacilitiesRequestForm_1.Width - Self.Width) / 2
            Y: =FacilitiesFormBackgroundRectangle_1.Y + FacilitiesFormBackgroundRectangle_1.Height - Self.Height - 24
