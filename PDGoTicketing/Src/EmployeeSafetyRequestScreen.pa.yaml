                        Visible: =Parent.DisplayMode=DisplayMode.Edit
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =EmployeeSafetyServiceCategoryInput.Y + EmployeeSafetyServiceCategoryInput.Height
                  - EmployeeSafetyServiceCategoryRequiredIndicator:
