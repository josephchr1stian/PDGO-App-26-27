      - FacilitiesRequestTitleLabel:
          Control: Label
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =RGBA(255, 255, 255, 1)
            Height: =64
            Size: =If(Parent.Width < 480, 18, Parent.Width < 768, 20, 24)
            Text: ="Submit a Facility Request"
            Width: =Parent.Width - 48
            X: =(Parent.Width - Self.Width) / 2
            Y: |-
              =FacilitiesHeaderBarRectangle.Y +
              (FacilitiesHeaderBarRectangle.Height - Self.Height) / 2
      - FacilitiesSubmitRequestButton:
          Control: Classic/Button
          Properties:
            Height: |
              =44
            OnSelect: |-
              =Set(varShowSubmitErrors, true);

              If(
                  IsBlank(FacilitiesServiceSubcategoryDropdown.Selected.Value),
                  Notify("Please select a Service Subcategory.", NotificationType.Error),

                  FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request" &&
                  IsBlank(FacilitiesParkingLocationDropdown.Selected.Value),
                  Notify("Please select a Parking Location.", NotificationType.Error),

                  FacilitiesServiceSubcategoryDropdown.Selected.Value = "Building Maintenance" &&
                  IsBlank(FacilitiesRequestTypeDropdown.Selected.Value),
                  Notify("Please select a Request Type.", NotificationType.Error),

                  FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request" &&
                  FacilitiesParkingLocationDropdown.Selected.Value = "Civic Center" &&
                  IfError(
                      !IsEmpty(Filter(
                          Filter(AdministrativeServiceRequests, RequestedBy = User().Email && ServiceSubcategory = "Parking Request"),
                          ID in Filter('Waitlist Queue', QueueStatus.Value = "Waiting" || QueueStatus.Value = "Offered").TicketID
                      )),
                      false
                  ),
                  Notify("You're already on the Civic Center waitlist.", NotificationType.Warning),

                  SubmitForm(FacilitiesRequestForm)
              )
            Text: ="Submit Request"
            Visible: |-
              =!(
                  FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request" &&
                  FacilitiesParkingLocationDropdown.Selected.Value = "Other parking locations (free)"
              )
            Width: =Min(240, Parent.Width - 48)
            X: =(Parent.Width - Self.Width) / 2
            Y: =Parent.Height - Self.Height - 60
