Screens:
  FacilitiesRequestScreen:
    Properties:
      OnVisible: |-
        =Set(varResetAttachments, false);
        Set(varShowSubmitErrors, false);
        NewForm(FacilitiesRequestForm);
        ResetForm(FacilitiesRequestForm)
    Children:
      - FacilitiesBackToHomeButton:
          Control: Classic/Button
          Properties:
            Height: =44
            OnSelect: =Navigate('Pdgo Hub 10-30-26', ScreenTransition.Fade)
            Text: ="← Back to Home"
            Width: =Min(200, Parent.Width - 48)
            X: |-
              =If(
                  Parent.Width < 600,
                  12,
                  24
              )
            Y: |-
              =FacilitiesHeaderBarRectangle.Y +
              FacilitiesHeaderBarRectangle.Height +
              8
      - FacilitiesFormBackgroundRectangle:
          Control: Rectangle
          Properties:
            Height: |-
              =FacilitiesSubmitRequestButton.Y +
              FacilitiesSubmitRequestButton.Height +
              12 -
              Self.Y
            Width: |-
              =Min(
                  FacilitiesRequestForm.Width + 32,
                  Parent.Width - 8
              )
            X: =(Parent.Width - Self.Width) / 2
            Y: =FacilitiesRequestForm.Y - 12
      - FacilitiesHeaderBarRectangle:
          Control: Rectangle
          Properties:
            Height: |-
              =If(
                  Parent.Width < 600,
                  64,
                  64
              )
            Width: =Parent.Width
      - FacilitiesRequestForm:
          Control: Form
          Variant: Classic
          Layout: Vertical
          Properties:
            DataSource: =AdministrativeServiceRequests
            DefaultMode: =FormMode.New
            Height: |-
              =Max(
                  200,
                  FacilitiesSubmitRequestButton.Y - Self.Y - 32
              )
            NumberOfColumns: =1
            OnFailure: |
              =Notify(
                  "Submission failed: " & FacilitiesRequestForm.Error,
                  NotificationType.Error
              )
            OnSuccess: |-
              =Set(SubmittedRequestID, FacilitiesRequestForm.LastSubmit.ID);

              If(
                  FacilitiesRequestForm.LastSubmit.Status.Value = "Waiting List",
                  Patch('Waitlist Queue', Defaults('Waitlist Queue'), {
                      Title: "Civic Center Parking",
                      TicketID: FacilitiesRequestForm.LastSubmit.ID,
                      QueueStatus: {Value: "Waiting"}
                  })
              );

              Notify("Your request has been submitted successfully!", NotificationType.Success);

              ResetForm(FacilitiesRequestForm);

              NewForm(FacilitiesRequestForm)
            Width: =Min(800, Parent.Width - 48)
            X: =(Parent.Width - Self.Width) / 2
            Y: =FacilitiesBackToHomeButton.Y + FacilitiesBackToHomeButton.Height + 24
          Children:
            - FacilitiesServiceCategoryDataCard:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="Title"
                  Default: =ThisItem.Title
                  DisplayName: ="Service Category"
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, Title)
                  Required: =true
                  Update: ="Facilities"
                  Visible: =false
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - FacilitiesServiceCategoryFieldLabel:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesServiceCategoryInput:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Visible: =false
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesServiceCategoryFieldLabel.Y + FacilitiesServiceCategoryFieldLabel.Height + 5
                  - FacilitiesServiceCategoryErrorLabel:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode=DisplayMode.Edit
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesServiceCategoryInput.Y + FacilitiesServiceCategoryInput.Height
                  - FacilitiesServiceCategoryRequiredIndicator:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Height: =FacilitiesServiceCategoryFieldLabel.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesServiceCategoryFieldLabel.Y
                  - FacilitiesServiceCategoryDropdown:
                      Control: Classic/DropDown
                      Properties:
                        AllowEmptySelection: =true
                        Default: =""
                        Items: |-
                          =[
                              "Facilities",
                              "Procurement",
                              "Employee Safety",
                              "Warehouse",
                              "Administrative Support"
                          ]
                        Items.Value: =Value
                        OnChange: |-
                          =Set(varShowSubmitErrors, false);

                          Reset(FacilitiesServiceSubcategoryDropdown);
                          Reset(FacilitiesRequestTypeDropdown);

                          Set(varResetAttachments, true);
                          Set(varResetAttachments, false)
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =40
            - FacilitiesServiceSubcategoryDataCard:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="ServiceSubcategory"
                  Default: =ThisItem.ServiceSubcategory
                  DisplayName: ="Service Subcategory"
                  Height: |-
                    =FacilitiesServiceSubcategoryDropdown.Y +
                    FacilitiesServiceSubcategoryDropdown.Height + 20
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, ServiceSubcategory)
                  Required: =true
                  Update: =FacilitiesServiceSubcategoryDropdown.Selected.Value
                  Width: =Parent.Width
                  X: =0
                  Y: =1
                Children:
                  - FacilitiesServiceSubcategoryFieldLabel:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesServiceSubcategoryInput:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Visible: =false
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesServiceSubcategoryFieldLabel.Y + FacilitiesServiceSubcategoryFieldLabel.Height + 5
                  - FacilitiesServiceSubcategoryErrorLabel:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode=DisplayMode.Edit
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesServiceSubcategoryInput.Y + FacilitiesServiceSubcategoryInput.Height
                  - FacilitiesServiceSubcategoryRequiredIndicator:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Height: =FacilitiesServiceSubcategoryFieldLabel.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesServiceSubcategoryFieldLabel.Y
                  - FacilitiesServiceSubcategoryDropdown:
                      Control: Classic/DropDown
                      Properties:
                        AllowEmptySelection: =true
                        Default: =""
                        Items: |-
                          =Table(
                              {Value: "Parking Request"},
                              {Value: "Locksmith Request"},
                              {Value: "Badge Access"},
                              {Value: "Space/Office Request"},
                              {Value: "Building Maintenance"},
                              {Value: "Filtered Water Requests"}
                          )
                        Items.Value: =Value
                        OnChange: |-
                          =Set(varShowSubmitErrors, false);

                          Reset(FacilitiesRequestTypeDropdown);

                          Set(varResetAttachments, true);
                          Set(varResetAttachments, false)
                        Width: =Parent.Width - 60
                        X: =30
                        Y: |-
                          =FacilitiesServiceSubcategoryFieldLabel.Y +
                          FacilitiesServiceSubcategoryFieldLabel.Height + 5
            - FacilitiesRequestTypeDataCard:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="RequestType"
                  Default: =ThisItem.'Request Type'
                  DisplayName: =DataSourceInfo([@AdministrativeServiceRequests],DataSourceInfo.DisplayName,'Request Type')
                  Height: =FacilitiesRequestTypeDropdown.Y + FacilitiesRequestTypeDropdown.Height + 20
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, 'Request Type')
                  Required: =FacilitiesServiceSubcategoryDropdown.Selected.Value = "Building Maintenance"
                  Update: |-
                    =If(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value = "Building Maintenance",
                        FacilitiesRequestTypeDropdown.Selected.Value,
                        Blank()
                    )
                  Visible: =FacilitiesServiceSubcategoryDropdown.Selected.Value = "Building Maintenance"
                  Width: =Parent.Width
                  X: =0
                  Y: =2
                Children:
                  - FacilitiesRequestTypeFieldLabel:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesRequestTypeInput:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Visible: =false
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesRequestTypeFieldLabel.Y + FacilitiesRequestTypeFieldLabel.Height + 5
                  - FacilitiesRequestTypeErrorLabel:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: |-
                          =If(
                              varShowSubmitErrors &&
                              FacilitiesServiceSubcategoryDropdown.Selected.Value = "Building Maintenance" &&
                              IsBlank(FacilitiesRequestTypeDropdown.Selected.Value),
                              "Request Type is required.",
                              Parent.Error
                          )
                        Visible: =Parent.DisplayMode = DisplayMode.Edit && varShowSubmitErrors
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesRequestTypeInput.Y + FacilitiesRequestTypeInput.Height
                  - FacilitiesRequestTypeRequiredIndicator:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Height: =FacilitiesRequestTypeFieldLabel.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesRequestTypeFieldLabel.Y
                  - FacilitiesRequestTypeDropdown:
                      Control: Classic/DropDown
                      Properties:
                        AllowEmptySelection: =true
                        Default: =""
                        Items: |-
                          =Table(
                              {Value: "Conference/Training Room Scheduling"},
                              {Value: "General Repairs / Exterior / Elevators"},
                              {Value: "Furniture"},
                              {Value: "Pest Control"},
                              {Value: "Electrical/Lighting"},
                              {Value: "Heating / Cooling / Ventilation"},
                              {Value: "Alarms"},
                              {Value: "Signage"},
                              {Value: "Plumbing/Restroom"},
                              {Value: "Janitorial and Cleaning"},
                              {Value: "Security Systems"}
                          )
                        Items.Value: =Value
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =40
            - FacilitiesLocationDataCard:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="Location"
                  Default: =ThisItem.Location
                  DisplayName: =DataSourceInfo([@AdministrativeServiceRequests],DataSourceInfo.DisplayName,Location)
                  Height: |-
                    =If(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request",
                        Max(
                            120,
                            FacilitiesParkingFeeLabel.Y + FacilitiesParkingFeeLabel.Height + 16
                        ),
                        120
                    )
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, Location)
                  Required: =true
                  Update: |-
                    =If(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request",
                        FacilitiesParkingLocationDropdown.Selected.Value,
                        FacilitiesLocationInput.Text
                    )
                  Width: =Parent.Width
                  X: =0
                  Y: =3
                Children:
                  - FacilitiesLocationFieldLabel:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesLocationInput:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =RGBA(210, 220, 230, 1)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        FocusedBorderColor: =RGBA(0, 120, 212, 1)
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Visible: =FacilitiesServiceSubcategoryDropdown.Selected.Value <> "Parking Request"
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesLocationFieldLabel.Y + FacilitiesLocationFieldLabel.Height + 5
                  - FacilitiesLocationErrorLabel:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode = DisplayMode.Edit && varShowSubmitErrors
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesLocationInput.Y + FacilitiesLocationInput.Height
                  - FacilitiesLocationRequiredIndicator:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Height: =FacilitiesLocationFieldLabel.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesLocationFieldLabel.Y
                  - FacilitiesParkingLocationDropdown:
                      Control: Classic/DropDown
                      Properties:
                        AllowEmptySelection: =true
                        Default: =Blank()
                        Items: |-
                          =Table(
                              {Value: "Civic Center"},
                              {Value: "Other parking locations (free)"}
                          )
                        Items.Value: =Value
                        Visible: =FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request"
                        Width: =FacilitiesLocationInput.Width
                        X: =FacilitiesLocationInput.X
                        Y: =FacilitiesLocationInput.Y
                  - FacilitiesParkingFeeLabel:
                      Control: Label
                      Properties:
                        AutoHeight: =true
                        Height: =50
                        Text: |-
                          =Switch(
                              FacilitiesParkingLocationDropdown.Selected.Value,
                              "Civic Center",
                              "Civic Center parking is paid and has a waiting list. Your request will be reviewed.",
                              "Other parking locations (free)",
                              "Parking at this location is free. You do not need to submit a request. No further action is necessary.",
                              ""
                          )
                        Visible: |-
                          =FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request" &&
                          !IsBlank(FacilitiesParkingLocationDropdown.Selected.Value)
                        Width: =FacilitiesParkingLocationDropdown.Width
                        X: =FacilitiesParkingLocationDropdown.X
                        Y: =FacilitiesParkingLocationDropdown.Y + FacilitiesParkingLocationDropdown.Height + 8
            - FacilitiesBuildingDataCard:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="Building"
                  Default: =ThisItem.Building
                  DisplayName: |-
                    =If(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request",
                        "Building / Parking Area",
                        "Building"
                    )
                  Height: =FacilitiesBuildingInput.Y + FacilitiesBuildingInput.Height + 20
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, Building)
                  Required: =FacilitiesServiceSubcategoryDropdown.Selected.Value <> "Parking Request"
                  Update: =FacilitiesBuildingInput.Text
                  Visible: |-
                    =!(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request" &&
                        FacilitiesParkingLocationDropdown.Selected.Value = "Other parking locations (free)"
                    )
                  Width: =Parent.Width
                  X: =0
                  Y: =4
                Children:
                  - FacilitiesBuildingFieldLabel:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesBuildingInput:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =RGBA(210, 220, 230, 1)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        FocusedBorderColor: =RGBA(0, 120, 212, 1)
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesBuildingFieldLabel.Y + FacilitiesBuildingFieldLabel.Height + 5
                  - FacilitiesBuildingErrorLabel:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode = DisplayMode.Edit && varShowSubmitErrors
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesBuildingInput.Y + FacilitiesBuildingInput.Height
                  - FacilitiesBuildingRequiredIndicator:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Height: =FacilitiesBuildingFieldLabel.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesBuildingFieldLabel.Y
            - FacilitiesRoomAreaDataCard:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="Floor"
                  Default: =ThisItem.'Room / Area'
                  DisplayName: ="Room / Area"
                  Height: =FacilitiesRoomAreaInput.Y + FacilitiesRoomAreaInput.Height + 20
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, 'Room / Area')
                  Required: =false
                  Update: =FacilitiesRoomAreaInput.Text
                  Visible: =FacilitiesServiceSubcategoryDropdown.Selected.Value <> "Parking Request"
                  Width: =Parent.Width
                  X: =0
                  Y: =5
                Children:
                  - FacilitiesRoomAreaFieldLabel:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesRoomAreaInput:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =RGBA(210, 220, 230, 1)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        FocusedBorderColor: =RGBA(0, 120, 212, 1)
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesRoomAreaFieldLabel.Y + FacilitiesRoomAreaFieldLabel.Height + 5
                  - FacilitiesRoomAreaErrorLabel:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode=DisplayMode.Edit
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesRoomAreaInput.Y + FacilitiesRoomAreaInput.Height
                  - FacilitiesRoomAreaRequiredIndicator:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Height: =FacilitiesRoomAreaFieldLabel.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesRoomAreaFieldLabel.Y
            - FacilitiesDescriptionDataCard:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="Description"
                  Default: =ThisItem.Description
                  DisplayName: |-
                    =Switch(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value,
                        "Parking Request", "Reason for Parking Request",
                        "Locksmith Request", "Reason for Locksmith Request",
                        "Badge Access", "Reason for Badge Access",
                        "Space/Office Request", "Reason for Space/Office Request",
                        "Filtered Water Requests", "Description of Water Service Request",
                        "Building Maintenance", "Description",
                        "Description"
                    )
                  Height: =FacilitiesDescriptionInput.Y + FacilitiesDescriptionInput.Height + 20
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, Description)
                  Required: |-
                    =If(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request",
                        FacilitiesParkingLocationDropdown.Selected.Value = "Civic Center",
                        true
                    )
                  Update: =FacilitiesDescriptionInput.Text
                  Visible: |-
                    =!(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request" &&
                        FacilitiesParkingLocationDropdown.Selected.Value = "Other parking locations (free)"
                    )
                  Width: =Parent.Width
                  X: =0
                  Y: =6
                Children:
                  - FacilitiesDescriptionFieldLabel:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesDescriptionInput:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =RGBA(210, 220, 230, 1)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        FocusedBorderColor: =RGBA(0, 120, 212, 1)
                        Height: =100
                        MaxLength: =Parent.MaxLength
                        Mode: =TextMode.MultiLine
                        PaddingLeft: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesDescriptionFieldLabel.Y + FacilitiesDescriptionFieldLabel.Height + 5
                  - FacilitiesDescriptionErrorLabel:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode = DisplayMode.Edit && varShowSubmitErrors
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesDescriptionInput.Y + FacilitiesDescriptionInput.Height
                  - FacilitiesDescriptionRequiredIndicator:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Height: =FacilitiesDescriptionFieldLabel.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesDescriptionFieldLabel.Y
            - FacilitiesPriorityDataCard:
                Control: TypedDataCard
                Variant: ClassicComboBoxEdit
                Properties:
                  DataField: ="Priority"
                  Default: =ThisItem.Priority
                  DisplayName: =DataSourceInfo([@AdministrativeServiceRequests],DataSourceInfo.DisplayName,Priority)
                  Height: =FacilitiesPriorityDropdown.Y + FacilitiesPriorityDropdown.Height + 20
                  Required: =false
                  Update: |-
                    ={Value: FacilitiesPriorityDropdown.Selected.Value}
                  Visible: |-
                    =!(
                        FacilitiesServiceSubcategoryDropdown.Selected.Value = "Parking Request" &&
                        FacilitiesParkingLocationDropdown.Selected.Value = "Other parking locations (free)"
                    )
                  Width: =Parent.Width
                  X: =0
                  Y: =7
                Children:
                  - FacilitiesPriorityFieldLabel:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
