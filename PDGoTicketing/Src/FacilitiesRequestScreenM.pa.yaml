Screens:
  FacilitiesRequestScreenM:
    Properties:
      Fill: =RGBA(248, 249, 252, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varResetAttachments, false);
        Set(varShowSubmitErrors, false);
        NewForm(FacilitiesRequestFormM);
        ResetForm(FacilitiesRequestFormM)
    Children:
      - FacilitiesBackToHomeButtonM:
          Control: Classic/Button
          Properties:
            BorderColor: =RGBA(210, 220, 230, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =1
            Color: =RGBA(0, 120, 212, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: =Navigate('Pdgo Hub', ScreenTransition.Fade)
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Text: ="← Back to Home"
            Width: =Min(200, Parent.Width - 48)
            X: |-
              =If(
                  Parent.Width < 600,
                  12,
                  24
              )
            Y: |-
              =FacilitiesHeaderBarRectangleM.Y +
              FacilitiesHeaderBarRectangleM.Height +
              8
      - FacilitiesFormBackgroundRectangleM:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(218, 225, 233, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =1
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =4
            Height: |-
              =FacilitiesSubmitRequestButtonM.Y +
              FacilitiesSubmitRequestButtonM.Height +
              12 -
              Self.Y
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            Width: |-
              =Min(
                  FacilitiesRequestFormM.Width + 32,
                  Parent.Width - 8
              )
            X: =(Parent.Width - Self.Width) / 2
            Y: =FacilitiesRequestFormM.Y - 12
      - FacilitiesHeaderBarRectangleM:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: =RGBA(0, 120, 212, 1)
            FocusedBorderThickness: =4
            Height: |-
              =If(
                  Parent.Width < 600,
                  48,
                  64
              )
            HoverFill: =RGBA(0, 120, 212, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            Width: =Parent.Width
      - FacilitiesRequestFormM:
          Control: Form
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            DataSource: =AdministrativeServiceRequests
            DefaultMode: =FormMode.New
            Height: |-
              =Max(
                  200,
                  FacilitiesSubmitRequestButtonM.Y - Self.Y - 32
              )
            NumberOfColumns: =1
            OnFailure: |
              =Notify(
                  "Submission failed: " & FacilitiesRequestFormM.Error,
                  NotificationType.Error
              )
            OnSuccess: |-
              =Set(
                  SubmittedRequestID,
                  FacilitiesRequestFormM.LastSubmit.ID
              );

              Notify(
                  "Your request has been submitted successfully!",
                  NotificationType.Success
              );

              ResetForm(FacilitiesRequestFormM);

              NewForm(FacilitiesRequestFormM)
            Width: =Min(800, Parent.Width - 48)
            X: =(Parent.Width - Self.Width) / 2
            Y: =FacilitiesBackToHomeButtonM.Y + FacilitiesBackToHomeButtonM.Height + 24
          Children:
            - FacilitiesServiceCategoryDataCardM:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  DataField: ="Title"
                  Default: =ThisItem.Title
                  DisplayName: ="Service Category"
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, Title)
                  Required: =true
                  Update: ="Facilities"
                  Visible: =false
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - FacilitiesServiceCategoryFieldLabelM:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesServiceCategoryInputM:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        DisplayMode: =Parent.DisplayMode
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Visible: =false
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesServiceCategoryFieldLabelM.Y + FacilitiesServiceCategoryFieldLabelM.Height + 5
                  - FacilitiesServiceCategoryErrorLabelM:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(168, 0, 0, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(168, 0, 0, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode=DisplayMode.Edit
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesServiceCategoryInputM.Y + FacilitiesServiceCategoryInputM.Height
                  - FacilitiesServiceCategoryRequiredIndicatorM:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =FacilitiesServiceCategoryFieldLabelM.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesServiceCategoryFieldLabelM.Y
                  - FacilitiesServiceCategoryDropdownM:
                      Control: Classic/DropDown
                      Properties:
                        AllowEmptySelection: =true
                        BorderColor: =RGBA(210, 220, 230, 1)
                        BorderThickness: =1
                        ChevronBackground: =RGBA(255, 255, 255, 1)
                        ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                        ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                        ChevronFill: =RGBA(0, 120, 212, 1)
                        ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                        ChevronHoverFill: =RGBA(50, 49, 48, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =""
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(245, 249, 255, 1)
                        Items: |-
                          =[
                              "Facilities",
                              "Procurement",
                              "Employee Safety",
                              "Warehouse",
                              "Administrative Support"
                          ]
                        Items.Value: =Value
                        OnChange: |-
                          =Set(varShowSubmitErrors, false);

                          Reset(FacilitiesServiceSubcategoryDropdownM);
                          Reset(FacilitiesRequestTypeDropdownM);

                          Set(varResetAttachments, true);
                          Set(varResetAttachments, false)
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedBorderColor: =RGBA(16, 110, 190, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        SelectionColor: =RGBA(50, 49, 48, 1)
                        SelectionFill: =RGBA(0, 120, 212, 1)
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =40
            - FacilitiesServiceSubcategoryDataCardM:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  DataField: ="ServiceSubcategory"
                  Default: =ThisItem.ServiceSubcategory
                  DisplayName: ="Service Subcategory"
                  Height: |-
                    =FacilitiesServiceSubcategoryDropdownM.Y +
                    FacilitiesServiceSubcategoryDropdownM.Height + 20
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, ServiceSubcategory)
                  Required: =true
                  Update: =FacilitiesServiceSubcategoryDropdownM.Selected.Value
                  Width: =Parent.Width
                  X: =0
                  Y: =1
                Children:
                  - FacilitiesServiceSubcategoryFieldLabelM:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesServiceSubcategoryInputM:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        DisplayMode: =Parent.DisplayMode
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Visible: =false
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesServiceSubcategoryFieldLabelM.Y + FacilitiesServiceSubcategoryFieldLabelM.Height + 5
                  - FacilitiesServiceSubcategoryErrorLabelM:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(168, 0, 0, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(168, 0, 0, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode=DisplayMode.Edit
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesServiceSubcategoryInputM.Y + FacilitiesServiceSubcategoryInputM.Height
                  - FacilitiesServiceSubcategoryRequiredIndicatorM:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =FacilitiesServiceSubcategoryFieldLabelM.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesServiceSubcategoryFieldLabelM.Y
                  - FacilitiesServiceSubcategoryDropdownM:
                      Control: Classic/DropDown
                      Properties:
                        AllowEmptySelection: =true
                        BorderColor: =RGBA(210, 220, 230, 1)
                        BorderThickness: =1
                        ChevronBackground: =RGBA(255, 255, 255, 1)
                        ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                        ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                        ChevronFill: =RGBA(0, 120, 212, 1)
                        ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                        ChevronHoverFill: =RGBA(50, 49, 48, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =""
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(245, 249, 255, 1)
                        Items: |-
                          =Table(
                              {Value: "Parking Request"},
                              {Value: "Locksmith Request"},
                              {Value: "Badge Access"},
                              {Value: "Space/Office Request"},
                              {Value: "Building Maintenance"},
                              {Value: "Filtered Water Requests"}
                          )
                        Items.Value: =Value
                        OnChange: |-
                          =Set(varShowSubmitErrors, false);

                          Reset(FacilitiesRequestTypeDropdownM);

                          Set(varResetAttachments, true);
                          Set(varResetAttachments, false)
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedBorderColor: =RGBA(16, 110, 190, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        SelectionColor: =RGBA(50, 49, 48, 1)
                        SelectionFill: =RGBA(0, 120, 212, 1)
                        Width: =Parent.Width - 60
                        X: =30
                        Y: |-
                          =FacilitiesServiceSubcategoryFieldLabelM.Y +
                          FacilitiesServiceSubcategoryFieldLabelM.Height + 5
            - FacilitiesRequestTypeDataCardM:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  DataField: ="RequestType"
                  Default: =ThisItem.'Request Type'
                  DisplayName: =DataSourceInfo([@AdministrativeServiceRequests],DataSourceInfo.DisplayName,'Request Type')
                  Height: =FacilitiesRequestTypeDropdownM.Y + FacilitiesRequestTypeDropdownM.Height + 20
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, 'Request Type')
                  Required: =FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Building Maintenance"
                  Update: |-
                    =If(
                        FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Building Maintenance",
                        FacilitiesRequestTypeDropdownM.Selected.Value,
                        Blank()
                    )
                  Visible: =FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Building Maintenance"
                  Width: =Parent.Width
                  X: =0
                  Y: =2
                Children:
                  - FacilitiesRequestTypeFieldLabelM:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesRequestTypeInputM:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        DisplayMode: =Parent.DisplayMode
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Visible: =false
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesRequestTypeFieldLabelM.Y + FacilitiesRequestTypeFieldLabelM.Height + 5
                  - FacilitiesRequestTypeErrorLabelM:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(168, 0, 0, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(168, 0, 0, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: |-
                          =If(
                              varShowSubmitErrors &&
                              FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Building Maintenance" &&
                              IsBlank(FacilitiesRequestTypeDropdownM.Selected.Value),
                              "Request Type is required.",
                              Parent.Error
                          )
                        Visible: =Parent.DisplayMode = DisplayMode.Edit && varShowSubmitErrors
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =FacilitiesRequestTypeInputM.Y + FacilitiesRequestTypeInputM.Height
                  - FacilitiesRequestTypeRequiredIndicatorM:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =FacilitiesRequestTypeFieldLabelM.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =FacilitiesRequestTypeFieldLabelM.Y
                  - FacilitiesRequestTypeDropdownM:
                      Control: Classic/DropDown
                      Properties:
                        AllowEmptySelection: =true
                        BorderColor: =RGBA(210, 220, 230, 1)
                        BorderThickness: =1
                        ChevronBackground: =RGBA(255, 255, 255, 1)
                        ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                        ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                        ChevronFill: =RGBA(0, 120, 212, 1)
                        ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                        ChevronHoverFill: =RGBA(50, 49, 48, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =""
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(245, 249, 255, 1)
                        Items: |-
                          =Table(
                              {Value: "Conference/Training Room Scheduling"},
                              {Value: "General Repairs / Exterior / Elevators"},
                              {Value: "Furniture"},
                              {Value: "Pest Control"},
                              {Value: "Electrical/Lighting"},
                              {Value: "Heating / Cooling / Ventilation"},
                              {Value: "Alarms"},
                              {Value: "Signage"},
                              {Value: "Plumbing/Restroom"},
                              {Value: "Janitorial and Cleaning"},
                              {Value: "Security Systems"}
                          )
                        Items.Value: =Value
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedBorderColor: =RGBA(16, 110, 190, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        SelectionColor: =RGBA(50, 49, 48, 1)
                        SelectionFill: =RGBA(0, 120, 212, 1)
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =40
            - FacilitiesLocationDataCardM:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  DataField: ="Location"
                  Default: =ThisItem.Location
                  DisplayName: =DataSourceInfo([@AdministrativeServiceRequests],DataSourceInfo.DisplayName,Location)
                  Height: |-
                    =If(
                        FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Parking Request",
                        Max(
                            120,
                            FacilitiesParkingFeeLabelM.Y + FacilitiesParkingFeeLabelM.Height + 16
                        ),
                        120
                    )
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, Location)
                  Required: =true
                  Update: |-
                    =If(
                        FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Parking Request",
                        FacilitiesParkingLocationDropdownM.Selected.Value,
                        FacilitiesLocationInputM.Text
                    )
                  Width: =Parent.Width
                  X: =0
                  Y: =3
                Children:
                  - FacilitiesLocationFieldLabelM:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - FacilitiesLocationInputM:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =RGBA(210, 220, 230, 1)
                        BorderThickness: =1
                        Color: =RGBA(50, 49, 48, 1)
