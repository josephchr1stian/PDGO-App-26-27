      - FacilitiesSubmitRequestButtonM:
          Control: Classic/Button
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            Height: |
              =44
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 95, 175, 1)
            OnSelect: |-
              =Set(varShowSubmitErrors, true);

              If(
                  IsBlank(FacilitiesServiceSubcategoryDropdownM.Selected.Value),
                  Notify(
                      "Please select a Service Subcategory.",
                      NotificationType.Error
                  ),

                  FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Parking Request" &&
                  IsBlank(FacilitiesParkingLocationDropdownM.Selected.Value),
                  Notify(
                      "Please select a Parking Location.",
                      NotificationType.Error
                  ),

                  FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Building Maintenance" &&
                  IsBlank(FacilitiesRequestTypeDropdownM.Selected.Value),
                  Notify(
                      "Please select a Request Type.",
                      NotificationType.Error
                  ),

                  SubmitForm(FacilitiesRequestFormM)
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 75, 145, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Submit Request"
            Visible: |-
              =!(
                  FacilitiesServiceSubcategoryDropdownM.Selected.Value = "Parking Request" &&
                  FacilitiesParkingLocationDropdownM.Selected.Value = "Other parking locations (free)"
              )
            Width: =Min(240, Parent.Width - 48)
            X: =(Parent.Width - Self.Width) / 2
            Y: =Parent.Height - Self.Height - 60
