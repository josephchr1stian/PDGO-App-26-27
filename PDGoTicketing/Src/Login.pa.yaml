Screens:
  Login:
    Properties:
      Fill: =RGBA(243, 242, 241, 1)
      OnVisible: |-
        =Set(varRole, "");
        Set(varEmail, "");
        Reset(username);
        Reset(password);
        Set(varDept, "");
    Children:
      - conLoginPage:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 255)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conLogin:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =24
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - loginTitle:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        FontWeight: =FontWeight.Bold
                        Height: =100
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =32
                        Text: |-
                          ="PD Go Login
                          "
                        Width: =300
                  - username:
                      Control: Classic/TextInput
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =""
                        Height: =56
                        HintText: ="Email"
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =18
                  - password:
                      Control: Classic/TextInput
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =""
                        Height: =56
                        HintText: ="Password"
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Mode: =TextMode.Password
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =18
                  - sign in:
                      Control: Classic/Button
                      Properties:
                        Fill: =RGBA(0, 18, 107, 1)
                        Height: =56
                        HoverFill: =RGBA(0, 69, 120, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(varEmail, Lower(Trim(Coalesce(If(varTestMode, username.Text, ""), User().Email))));
                          Set(varUser, LookUp('PDGo Users', Email = varEmail));
                          Set(varRole, Coalesce(varUser.Role.Value, "User"));
                          Set(varDept, Coalesce(varUser.ServiceSubcategory, ""));
                          Set(varLoginError, "");
                          Reset(username);
                          Navigate(
                              If(varRole = "Supervisor" || varRole = "Admin", 'Pdgo Hub 10-30-26', 'Pdgo Hub 10-30-26'),
                              ScreenTransition.Fade
                          )
                        PressedFill: =RGBA(0, 12, 75, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =18
                        Text: ="Sign in"
                  - Label2:
                      Control: Label
                      Properties:
                        Color: =RGBA(164, 38, 44, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: =varLoginError
                        Visible: =Not(IsBlank(varLoginError))
