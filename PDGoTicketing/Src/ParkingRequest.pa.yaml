Screens:
  ParkingRequest:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: "=Refresh('Parking Requests'); Set(varParkingSaving, false); ResetForm(frmParkingWaitlist); NewForm(frmParkingWaitlist)   "
    Children:
      - lblParkingHeading:
          Control: Label@2.5.1
          Properties:
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =28
            Text: ="Parking request"
            Width: =700
            X: =40
            Y: =30
      - lblParkingIntro:
          Control: Label@2.5.1
          Properties:
            Height: =50
            Size: =15
            Text: ="Civic Center requests join the waiting list immediately. Joe or Deepak reviews the queue."
            Width: =Parent.Width - 80
            X: =40
            Y: =95
      - ddParkingGarage:
          Control: Classic/DropDown@2.3.1
          Properties:
            AccessibleLabel: ="Choose parking location"
            Default: ="Civic Center"
            Height: =44
            Items: =["Civic Center", "Other parking locations (free)"]
            Items.Value: =Value
            Width: =Min(600, Parent.Width - 80)
            X: =40
            Y: =155
      - lblParkingMessage:
          Control: Label@2.5.1
          Properties:
            Height: =65
            Live: =Live.Polite
            Size: =15
            Text: =If(ddParkingGarage.Selected.Value <> "Civic Center", "Parking at other locations is free. No parking request is needed.", !IsBlank(LookUp('Parking Requests', ActiveKey = Lower(User().Email))), "You’re already on the waiting list. You cannot submit another request.", "Complete the form to join the Civic Center parking waiting list.")
            Width: =Parent.Width - 80
            X: =40
            Y: =210
      - frmParkingWaitlist:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            DataSource: ='Parking Requests'
            DefaultMode: =FormMode.New
            Height: =320
            Item: =Defaults('Parking Requests')
            NumberOfColumns: =1
            OnFailure: =Set(varParkingSaving, false); Refresh('Parking Requests'); Notify(If(!IsBlank(LookUp('Parking Requests', ActiveKey = Lower(User().Email))), "You’re already on the waiting list.", "Could not save your request. " & Self.Error), NotificationType.Error)
            OnSuccess: =Set(varParkingSaving, false); Refresh('Parking Requests'); Notify("Your Civic Center request has been added to the waiting list.", NotificationType.Success); ResetForm(Self); NewForm(Self)
            Visible: =ddParkingGarage.Selected.Value = "Civic Center" && IsBlank(LookUp('Parking Requests', ActiveKey = Lower(User().Email)))
            Width: =Min(800, Parent.Width - 30)
            X: =10
            Y: =280
          Children:
            - pcTitle:
                Control: TypedDataCard@1.0.7
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="Title"
                  Default: ="Civic Center - " & User().FullName
                  DisplayName: =""
                  MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                  Required: =false
                  Update: ="Civic Center - " & User().FullName
                  Visible: =false
                  X: =0
                  Y: =0
            - pcEmail:
                Control: TypedDataCard@1.0.7
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="RequesterEmail"
                  Default: =%QUALIFIED_DATACARD_FIELD_VALUE.ID%
                  DisplayName: =""
                  MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                  Required: =false
                  Update: =Lower(User().Email)
                  Visible: =false
                  X: =0
                  Y: =1
            - pcGarage:
                Control: TypedDataCard@1.0.7
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="Garage"
                  Default: =%QUALIFIED_DATACARD_FIELD_VALUE.ID%
                  DisplayName: =""
                  MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                  Required: =false
                  Update: ="Civic Center"
                  Visible: =false
                  X: =0
                  Y: =2
            - pcStatus:
                Control: TypedDataCard@1.0.7
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="RequestStatus"
                  Default: =%QUALIFIED_DATACARD_FIELD_VALUE.ID%
                  DisplayName: =""
                  MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                  Required: =false
                  Update: ="Waiting List"
                  Visible: =false
                  X: =0
                  Y: =3
            - pcActiveKey:
                Control: TypedDataCard@1.0.7
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="ActiveKey"
                  Default: =%QUALIFIED_DATACARD_FIELD_VALUE.ID%
                  DisplayName: =""
                  MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                  Required: =true
                  Update: =Lower(User().Email)
                  Visible: =false
                  X: =0
                  Y: =4
            - pcDetails:
                Control: TypedDataCard@1.0.7
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="RequestDetails"
                  Default: =%QUALIFIED_DATACARD_FIELD_VALUE.ID%
                  DisplayName: =""
                  Height: =135
                  MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                  Required: =false
                  Update: =Trim(txtParkingDetails.Text)
                  Width: =Parent.Width
                  X: =0
                  Y: =5
                Children:
                  - lblParkingDetails:
                      Control: Label@2.5.1
                      Properties:
                        Height: =35
                        Text: ="Additional information (optional)"
                        Width: =Parent.Width - 60
                        X: =30
                  - txtParkingDetails:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Additional parking request information, optional"
                        Default: =""
                        Height: =85
                        HintText: ="Add any information Facilities should know."
                        MaxLength: =2000
                        Mode: =TextMode.MultiLine
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =40
            - pcAttachments:
                Control: TypedDataCard@1.0.7
                Variant: ClassicAttachmentsEdit
                Properties:
                  DataField: ="{Attachments}"
                  Default: =ThisItem.Attachments
                  DisplayName: =""
                  Height: =170
                  Required: =false
                  Update: =attParking.Attachments
                  Width: =Parent.Width
                  X: =0
                  Y: =6
                Children:
                  - lblParkingAttachments:
                      Control: Label@2.5.1
                      Properties:
                        Height: =35
                        Text: ="Images or attachments (optional)"
                        Width: =Parent.Width - 60
                        X: =30
                  - attParking:
                      Control: Attachments@2.3.0
                      Properties:
                        DisplayMode: =Parent.DisplayMode
                        Height: =120
                        Items: =Parent.Default
                        MaxAttachments: =5
                        Tooltip: ="Optional attachments, up to 5 files, 10 MB each"
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =40
      - btnParkingJoin:
          Control: Classic/Button@2.2.0
          Properties:
            DisplayMode: =If(varParkingSaving || !frmParkingWaitlist.Valid, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =44
            OnSelect: =Refresh('Parking Requests'); If(!IsBlank(LookUp('Parking Requests', ActiveKey = Lower(User().Email))), Notify("You’re already on the waiting list.", NotificationType.Warning), Set(varParkingSaving, true); SubmitForm(frmParkingWaitlist))
            Text: =If(varParkingSaving, "Submitting…", "Join Civic Center waitlist")
            Visible: =ddParkingGarage.Selected.Value = "Civic Center" && IsBlank(LookUp('Parking Requests', ActiveKey = Lower(User().Email)))
            Width: =300
            X: =340
            Y: =600
      - lblParkingMyRequest:
          Control: Label@2.5.1
          Properties:
            Height: =180
            Size: =17
            Text: |-
              =With({r: LookUp('Parking Requests', ActiveKey = Lower(User().Email))}, If(IsBlank(r), "", "Your Civic Center request #" & Text(r.ID) & Char(10) & "Status: " & r.RequestStatus & Char(10) & "Submitted: " & Text(r.Created, "mmm d, yyyy h:mm AM/PM") & Char(10) & "Review team: Joe / Deepak"))
            Visible: =ddParkingGarage.Selected.Value = "Civic Center" && !IsBlank(LookUp('Parking Requests', ActiveKey = Lower(User().Email)))
            Width: =820
            X: =40
            Y: =290
      - btnParkingRefresh:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =44
            OnSelect: =Refresh('Parking Requests')
            Text: ="Refresh status"
            Width: =180
            X: =660
            Y: =600
      - btnParkingBack:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =44
            OnSelect: =Navigate(MainScreen1, ScreenTransition.None)
            Text: ="Back to Facilities"
            Width: =280
            X: =40
            Y: =600
      - ReviewersCard1_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(250, 250, 250, 1)
            Height: =If(App.Width < 640, 260, 512)
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Visible: =App.Width >= 640
            Width: =440
            X: =880
            Y: =40
          Children:
            - ReviewersHeading1_1:
                Control: ModernText@1.0.0
                Properties:
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =16
                  Text: ="Approval flow"
                  Width: =Parent.Width - 32
            - ReviewersSub1_1:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(96, 94, 92, 1)
                  Height: =20
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    =With({r: LookUp(ReviewersGallery1_1.AllItems, Status = "current"), d: LookUp(ReviewersGallery1_1.AllItems, Status = "denied")}, If(!IsBlank(d.Step), "Request denied · " & d.Name, IsBlank(r.Step), "All 4 steps complete", "Step " & r.Step & " of 4 · " & r.Role))
                  Width: =Parent.Width - 32
            - ReviewersGallery1_1:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  FillPortions: =0
                  Height: =384
                  Items: |-
                    =With({s: LookUp('Parking Requests', ActiveKey = Lower(User().Email))}, With({st: Lower(Coalesce(s.RequestStatus, "submitted"))}, With({den: !IsBlank(s) && (st = "denied" || st = "rejected"), cur: If(IsBlank(s), 1, Switch(st, "submitted", 2, "waitlisted", 2, "pending", 2, "in review", 2, "denied", 2, "rejected", 2, "approved", 3, "assigned", 3, "in progress", 3, "completed", 5, "closed", 5, 2))}, ForAll(Table({Step: 1, Name: If(IsBlank(s), "You", User().FullName), Role: "Request submitted"}, {Step: 2, Name: "Joe / Deepak", Role: "Waitlist review"}, {Step: 3, Name: "Parking", Role: "Spot assigned"}, {Step: 4, Name: "Done", Role: "Request completed"}), {Step: Step, Name: Name, Role: Role, Status: If(den && Step = 2, "denied", den && Step > 2, "waiting", Step < cur, "done", Step = cur, "current", "waiting"), IsFirst: Step = 1, IsLast: Step = 4}))))
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  TemplatePadding: =0
                  TemplateSize: =96
                  Width: =Parent.Width - 32
                Children:
                  - StepRow1_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =96
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.TemplateWidth
                      Children:
                        - StepRail1_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =96
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Width: =40
                            Children:
                              - StepTopLine1_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.IsFirst, RGBA(250, 250, 250, 1), If(ThisItem.Status = "waiting", RGBA(225, 223, 221, 1), RGBA(16, 124, 16, 1)))
                                    FillPortions: =0
                                    Height: =34
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Width: =2
                              - StepBadge1_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =Switch(ThisItem.Status, "done", RGBA(16, 124, 16, 1), "current", RGBA(0, 65, 179, 1), RGBA(225, 223, 221, 1))
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =100
                                    RadiusBottomRight: =100
                                    RadiusTopLeft: =100
                                    RadiusTopRight: =100
                                    Width: =28
                                  Children:
                                    - StepBadgeText1_1:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =If(ThisItem.Status = "waiting", RGBA(96, 94, 92, 1), RGBA(255, 255, 255, 1))
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =If(ThisItem.Status = "done", "✓", Text(ThisItem.Step))
                                          Width: =28
                              - StepBottomLine1_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.IsLast, RGBA(250, 250, 250, 1), If(ThisItem.Status = "done", RGBA(16, 124, 16, 1), RGBA(225, 223, 221, 1)))
                                    FillPortions: =0
                                    Height: =34
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Width: =2
                        - StepContent1_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =96
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                            Children:
                              - StepName1_1:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =ThisItem.Name
                                    Width: =Parent.Width
                              - StepRole1_1:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Height: =18
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =ThisItem.Role
                                    Width: =Parent.Width
                              - StepChip1_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.None
                                    Fill: =Switch(ThisItem.Status, "done", RGBA(223, 246, 221, 1), "current", RGBA(223, 237, 255, 1), "denied", RGBA(253, 231, 233, 1), RGBA(243, 242, 241, 1))
                                    FillPortions: =0
                                    Height: =24
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =8
                                    RadiusBottomLeft: =100
                                    RadiusBottomRight: =100
                                    RadiusTopLeft: =100
                                    RadiusTopRight: =100
                                    Width: =Switch(ThisItem.Status, "done", 116, "current", 116, 92)
                                  Children:
                                    - StepChipText1_1:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =Switch(ThisItem.Status, "done", RGBA(16, 124, 16, 1), "current", RGBA(0, 65, 179, 1), "denied", RGBA(196, 43, 28, 1), RGBA(96, 94, 92, 1))
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =Switch(ThisItem.Status, "done", "✓ Completed", "current", "• In progress", "denied", "✕ Denied", "○ Waiting")
                                          Width: =Parent.Width - 20
