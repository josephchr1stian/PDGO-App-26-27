Screens:
  Pdgo Hub 10-30-26:
    Properties:
      OnVisible: =Reset('Ticket Table')
    Children:
      - Dashboard Scroll:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =40
            Width: =Parent.Width
          Children:
            - Toolbar Options:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 104, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width
                Children:
                  - TitleRowWel1_1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =PDGoTheme.Colors.Primary
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =If(App.Width < 640, 16, 24)
                        PaddingRight: =If(App.Width < 640, 16, 24)
                        Width: =Parent.Width
                      Children:
                        - AppTitleWel1_1:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =If(App.Width < 640, 1, 0)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =If(App.Width < 640, 13, 16)
                              Text: ="PDGo Hub"
                              Width: =If(App.Width < 640, 0, 200)
                        - NavTabsDesktopWel1_1:
                            Control: ModernTabList
                            Properties:
                              Appearance: =   TabListAppearance.Transparent
                              BasePaletteColor: =RGBA(0, 65, 179, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Default: |-
                                ={Value: "Home"}
                              FillPortions: =1
                              Height: =56
                              Items: =NavTabs
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =Switch(
                                    Self.Selected.Value,
                                    "Current Tickets", Navigate(UserHome, ScreenTransition.Fade),
                                    "Admin", Navigate(AdminHome, ScreenTransition.Fade)
                                )
                              Visible: =App.Width >= 640
                        - IconChatWel1_1:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Message
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconShareWel1_1:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Share
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconSettingsWel1_1:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Settings
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - AvatarWel1_3:
                            Control: ModernAvatar
                            Properties:
                              Height: =32
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =Set(varMenu, !varMenu)
                              Width: =32
                        - Image1:
                            Control: Image
                            Properties:
                              Height: =48
                              Image: ='Public Defender Logo'
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =48
                  - NavTabsMobileWel1_1:
                      Control: ModernTabList
                      Properties:
                        Appearance: =   TabListAppearance.Transparent
                        BasePaletteColor: =RGBA(0, 65, 179, 1)
                        Default: |-
                          ={Value: "Home"}
                        Height: =If(App.Width < 640, 48, 0)
                        Items: =NavTabs
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Switch(Self.Selected.Value, "Admin", Navigate(AdminHome, ScreenTransition.Fade))
                        Width: =Parent.Width
                  - Table1_3:
                      Control: ModernDataGrid
                      Properties:
                        Height: =If(Self.Y + 500 > Parent.Height, Parent.Height - Self.Y, 500)
                        Items: |-
                          =If(
                              (varRole = "Admin" || varRole = "Supervisor") && varView <> "Submitted",
                              Sort(Filter(AdministrativeServiceRequests, AssignedTo = varEmail), RequestDate, SortOrder.Descending),
                              Sort(Filter(AdministrativeServiceRequests, RequestedBy = varEmail), RequestDate, SortOrder.Descending)
                          )
                        OnChange: |-
                          =Set(selTicket, Self.Selected); 
                          Set(varPreviousScreen, AdminHome);
                          Navigate(TicketDetailScreen, ScreenTransition.Fade)
                        SelectMultiple: =false
                        ShowSelector: =false
                        Width: =1280
                        X: =40
                        Y: =368
                      Children:
                        - Category11_3:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Category"
                              FieldName: ="cr8f7_Category"
                              FieldVariantName: ="complexTypeColumn"
                              Text: =ThisItem.Title
                        - Modified On11_3:
                            Control: ModernDataGridColumn
                            Variant: DateTime
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Modified On"
                              FieldName: ="modifiedon"
                              FieldVariantName: ="textualColumn"
                              Text: =Text(ThisItem.Modified, DateTimeFormat.LongDateTime)
                        - Created On11_3:
                            Control: ModernDataGridColumn
                            Variant: DateTime
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Created On"
                              FieldName: ="createdon"
                              FieldVariantName: ="textualColumn"
                              Text: =Text(ThisItem.Created, "mmm d, yyyy")
                        - Ticket Status11_3:
                            Control: ModernDataGridColumn
                            Variant: ComplexOptionSet
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Ticket Status"
                              FieldName: ="cr8f7_ticketstatus"
                              FieldVariantName: ="textualColumn"
                              Text: =ThisItem.Status.Value
                        - Description11_4:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Description"
                              FieldName: ="cr8f7_description"
                              FieldVariantName: ="textualColumn"
                              Text: =ThisItem.Description
                        - Title51_3:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Title"
                              FieldName: ="cr8f7_title"
                              FieldVariantName: ="textualColumn"
                              Text: =ThisItem.ServiceSubcategory
            - Hero Banner:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(220, 234, 250, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 210, 180)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =24
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =24
                  Width: =Parent.Width
                Children:
                  - txtWelcome:
                      Control: Label
                      Properties:
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =If(App.Width < 640, 22, 28)
                        Text: ="Welcome back, " & Coalesce(First(Split(User().FullName, " ")).Value, "there")
                        Width: =Parent.Width - 2 * If(App.Width < 640, 16, 40)
                  - txtWelcomeSub:
                      Control: ModernText
                      Properties:
                        Color: =RGBA(50, 49, 48, 1)
                        Height: =28
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =14
                        Text: ="Submit a request or check on an existing one."
                        Width: =Parent.Width - 2 * If(App.Width < 640, 16, 40)
                  - txtSearch:
                      Control: ModernTextInput
                      Properties:
                        Height: =44
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Placeholder: ="Search your tickets"
                        Width: =Min(Parent.Width - 2 * If(App.Width < 640, 16, 40), 520)
            - Category Header:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  FontWeight: =FontWeight.Bold
                  Height: =72
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  Size: =18
                  Text: ="Create a Ticket"
                  VerticalAlign: =VerticalAlign.Bottom
            - Button Categories:
                Control: GroupContainer
                Variant: GridLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =(RoundUp(6 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0) * 168) + ((RoundUp(6 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0) - 1) * 16) + 8
                  LayoutGap: =16
                  LayoutGridColumnMinWidth: =(Parent.Width - 2 * If(App.Width < 640, 16, 40) - (If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)) - 1) * 16) / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)) - 4
                  LayoutGridColumns: =If(App.Width < 640, 1, If(App.Width < 1024, 2, 3))
                  LayoutGridRowMinHeight: =120
                  LayoutGridRows: =RoundUp(6 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =16
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =0
                  Width: =Parent.Width
                Children:
                  - CapCardWel_12:
                      Control: ModernCard
                      Properties:
                        Fill: =FacilitiesTheme.Colors.Primary
                        Image: =BlankImg
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        OnSelect: =Navigate('FacilitiesRequestScreen',ScreenTransition.Fade)
                        Subtitle: ="Building services, repairs, maintenance, office moves"
                        Title: ="Facilities"
                  - CapCardWel_32:
                      Control: ModernCard
                      Properties:
                        Fill: =ProcurementTheme.Colors.Primary
                        Image: =BlankImg
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        OnSelect: =Navigate(ProcurementRequestScreen, ScreenTransition.Fade)
                        Subtitle: ="Purchase requests, supplies, equipment, vendors, quotes"
                        SubtitleColor: =RGBA(255, 255, 255, 1)
                        Title: ="Procurement"
                        TitleColor: =RGBA(255, 255, 255, 1)
                  - CapCardWel_42:
                      Control: ModernCard
                      Properties:
                        Fill: =SafetyTheme.Colors.Primary
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        OnSelect: =Navigate(EmployeeSafetyRequestScreen, ScreenTransition.Fade)
                        Subtitle: ="Safety concerns, ergonomics, hazards, inspections, training"
                        Title: ="Employee Safety"
                  - CapCardWel_52:
                      Control: ModernCard
                      Properties:
                        Fill: =WarehouseTheme.Colors.Primary
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        OnSelect: =Navigate(WarehouseRequestScreen, ScreenTransition.Fade)
                        Subtitle: ="Supply & Equipment requests, deliveries, surplus, storage"
                        Title: |
                          ="Warehouse"
                  - CapCardWel_62:
                      Control: ModernCard
                      Properties:
                        Fill: =AdminSupportTheme.Colors.Primary
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        OnSelect: =Navigate(AdministrativeSupportRequestScreen, ScreenTransition.Fade)
                        Subtitle: ="General requests, access, workspace setup, & other administrative needs"
                        Title: ="Administrative Support"
            - Table Header:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  FontWeight: =FontWeight.Semibold
                  Height: =72
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Navigate(TicketRequestScreen, ScreenTransition.Fade)
                  PaddingBottom: =8
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  Size: =18
                  Text: ="My Requests"
                  VerticalAlign: =VerticalAlign.Bottom
            - Ticket Table:
                Control: ModernDataGrid
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  Height: =If(App.Width < 640, 320, 360)
                  Items: |-
                    =Sort(
                        If(
                            varRole = "Admin" || varRole = "Supervisor",
                            Filter(AdministrativeServiceRequests, AssignedTo = varEmail || RequestedBy = varEmail),
                            Filter(AdministrativeServiceRequests, RequestedBy = varEmail)
                        ),
                        If(Status.Value in ["Completed", "Closed", "Resolved", "Declined", "Released"], 10000000000000, 0) - Value(Created),
                        SortOrder.Ascending
                    )
                  OnChange: |-
                    =If(!IsBlank(Self.Selected), Set(selTicket, Self.Selected); Set(varPreviousScreen, 'Pdgo Hub 10-30-26'); If(selTicket.Status.Value in ["Resolved", "Closed"] && IsBlank(LookUp(PDGOSurveyResponses, TicketID = selTicket.ID)), Set(varSurveyTicket, {ID: selTicket.ID, Service: Coalesce(selTicket.'Request Type', "PD GO"), Category: selTicket.Title, Location: selTicket.Building & ", " & selTicket.'Room / Area', HandledBy: selTicket.AssignedTo, Submitted: selTicket.RequestDate, Completed: selTicket.Modified, Resolution: Blank()}); Set(varSurveyTicketID, Text(selTicket.ID)); Navigate(scrSurvey, ScreenTransition.Fade), Navigate(TicketDetail_11_05, ScreenTransition.Fade)))
                  ShowSelector: =false
                  Width: =Parent.Width - 2 * If(App.Width < 640, 16, 40)
                  X: =39
                  Y: =580
                Children:
                  - RequestedBy_Column1:
                      Control: ModernDataGridColumn
                      Variant: Textual
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Requested by"
                        FieldName: ="RequestedBy"
                        FieldVariantName: ="textualColumn"
                        Text: =ThisItem.RequestedBy
                        Visible: =varRole = "Admin" || varRole = "Supervisor"
                  - AssignedTo_Column1:
                      Control: ModernDataGridColumn
                      Variant: Textual
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Assigned to"
                        FieldName: ="AssignedTo"
                        FieldVariantName: ="textualColumn"
                        Text: =ThisItem.AssignedTo
                        Visible: =varRole = "Admin" || varRole = "Supervisor"
                  - Modified_Column1:
                      Control: ModernDataGridColumn
                      Variant: Textual
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Last update"
                        FieldName: ="Modified"
                        FieldVariantName: ="textualColumn"
                        Text: =Text(ThisItem.Modified, "mmm d, yyyy")
                  - Created_Column1:
                      Control: ModernDataGridColumn
                      Variant: Textual
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Submitted"
                        FieldName: ="Created"
                        FieldVariantName: ="textualColumn"
                        Text: =	Text(ThisItem.Created, "mmm d, yyyy")
                  - Status_Column1:
                      Control: ModernDataGridColumn
                      Variant: Textual
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Status"
                        FieldName: ="Status"
                        FieldVariantName: ="textualColumn"
                        Icon: =If(ThisItem.Status.Value in ["Completed", "Closed", "Resolved", "Declined", "Released"], "CheckmarkCircle", ThisItem.Status.Value = "Waiting List" || ThisItem.Status.Value = "Offered", "Clock", "CircleHalfFill")
                        Text: =ThisItem.Status.Value
                  - Description_Column1:
                      Control: ModernDataGridColumn
                      Variant: Textual
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Details"
                        FieldName: ="Description"
                        FieldVariantName: ="textualColumn"
                        Text: =If(Len(ThisItem.Description) > 40, Left(ThisItem.Description, 40) & "…", ThisItem.Description)
                  - ServiceSubcategory_Column1:
                      Control: ModernDataGridColumn
                      Variant: Textual
                      IsLocked: true
                      Properties:
                        FieldDisplayName: ="Request"
                        FieldName: ="ServiceSubcategory"
                        FieldVariantName: ="textualColumn"
                        Text: =ThisItem.ServiceSubcategory
                  - ID_Column1:
                      Control: ModernDataGridColumn
                      Variant: Number
                      IsLocked: true
                      Properties:
                        FieldDisplayName: |-
                          ="Ticket #"
                        FieldName: ="ID"
                        FieldVariantName: ="numberColumn"
                        Value: =ThisItem.ID
                        Width: =90
      - AccountMenu_3:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =12
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =12
            Visible: =varMenu
            Width: =240
            X: =Parent.Width - Self.Width - 16
            Y: =64
          Children:
            - menuName_3:
                Control: Label
                Properties:
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: =If(IsBlank(varRole), "Not signed in", Coalesce(varUser.Title, User().FullName))
            - menuRole_3:
                Control: Label
                Properties:
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: =If(IsBlank(varRole), "Sign in to see your tickets", varEmail & " · " & varRole)
            - signOut_3:
                Control: Classic/Button
                Properties:
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Set(varMenu, false);
                    Set(varRole, "");
                    Set(varEmail, "");
                    Navigate(Login, ScreenTransition.Fade)
                  Text: ="Sign Out"
                  Visible: =Not(IsBlank(varRole))
            - signIn_3:
                Control: Classic/Button
                Properties:
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(varMenu, false); Navigate(Login, ScreenTransition.Fade)
                  Text: ="Sign In"
                  Visible: =IsBlank(varRole)
