                  - NavTabsMobileWel1_1:
                      Control: ModernTabList
                      Properties:
                        Appearance: =   TabListAppearance.Transparent
                        BasePaletteColor: =RGBA(0, 65, 179, 1)
                        Default: |-
                          ={Value: "Home"}
                        Height: =If(App.Width < 640, 48, 0)
                        Items: |-
                          =   If(
                                 varRole = "Admin" || varRole = "Supervisor",
                                 ["Home", "Current Tickets", "Admin"],
                                 ["Home", "Current Tickets"]
                             )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =   Switch(
                                 Self.Selected.Value,
                                 "Current Tickets", Navigate(UserHome, ScreenTransition.Fade),
                                 "Admin", Navigate(AdminHome, ScreenTransition.Fade)
                             )
                        Width: =Parent.Width
                  - Table1_3:
                      Control: ModernDataGrid
                      Properties:
                        Height: =If(Self.Y + 500 > Parent.Height, Parent.Height - Self.Y, 500)
                        Items: |-
                          =If(
                              (varRole = "Admin" || varRole = "Supervisor") && varView <> "Submitted",
                              Sort(Filter(AdministrativeServiceRequests, AssignedTo = varEmail), RequestDate, SortOrder.Descending),
                              Sort(Filter(AdministrativeServiceRequests, RequestedBy = varEmail), RequestDate, SortOrder.Descending)
                          )
                        OnChange: |-
                          =Set(selTicket, Self.Selected); 
                          Set(varPreviousScreen, AdminHome);
                          Navigate(TicketDetailScreen, ScreenTransition.Fade)
                        SelectMultiple: =false
                        ShowSelector: =false
