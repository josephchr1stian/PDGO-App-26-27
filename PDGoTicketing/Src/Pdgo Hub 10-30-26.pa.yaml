                              LayoutMinWidth: =16
                              Width: =24
                        - IconShareWel1_1:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Share
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconSettingsWel1_1:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Settings
