                              Text: =ThisItem.Description
                        - Title51_3:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Title"
                              FieldName: ="cr8f7_title"
                              FieldVariantName: ="textualColumn"
                              Text: =ThisItem.ServiceSubcategory
            - Hero Banner:
                Control: GroupContainer
