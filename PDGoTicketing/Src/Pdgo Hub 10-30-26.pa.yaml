                        - Category11_3:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Category"
                              FieldName: ="cr8f7_Category"
                              FieldVariantName: ="complexTypeColumn"
                              Text: =ThisItem.Title
                        - Modified On11_3:
                            Control: ModernDataGridColumn
                            Variant: DateTime
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Modified On"
                              FieldName: ="modifiedon"
                              FieldVariantName: ="textualColumn"
                              Text: =Text(ThisItem.Modified, DateTimeFormat.LongDateTime)
                        - Created On11_3:
                            Control: ModernDataGridColumn
                            Variant: DateTime
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Created On"
                              FieldName: ="createdon"
                              FieldVariantName: ="textualColumn"
                              Text: =Text(ThisItem.Created, "mmm d, yyyy")
