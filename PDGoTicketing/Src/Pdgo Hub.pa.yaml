Screens:
  Pdgo Hub:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - WelcomeScroll1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =40
            Width: =Parent.Width
          Children:
            - TopNavWel1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 104, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width
                Children:
                  - TitleRowWel1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =If(App.Width < 640, 16, 24)
                        PaddingRight: =If(App.Width < 640, 16, 24)
                        Width: =Parent.Width
                      Children:
                        - AppTitleWel1:
                            Control: ModernText
                            Properties:
                              FillPortions: =If(App.Width < 640, 1, 0)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =If(App.Width < 640, 13, 16)
                              Text: ="PDGo Hub"
                              Width: =If(App.Width < 640, 0, 200)
                        - NavTabsDesktopWel1:
                            Control: ModernTabList
                            Properties:
                              Appearance: =TabListAppearance.Subtle
                              BasePaletteColor: =RGBA(0, 65, 179, 1)
                              Default: |-
                                ={Value: "Home"}
                              FillPortions: =1
                              Height: =56
                              Items: =["Request Help", "Current Tickets", "Admin"]
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =If(Self.Selected.Value = "Current Tickets", Navigate(UserHome, ScreenTransition.Fade))
                              Visible: =App.Width >= 640
                        - IconChatWel1:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Message
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconShareWel1:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Share
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconSettingsWel1:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Settings
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - AvatarWel1:
                            Control: ModernAvatar
                            Properties:
                              Height: =32
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =Set(varMenu, !varMenu)
                              Width: =32
                  - NavTabsMobileWel1:
                      Control: ModernTabList
                      Properties:
                        Appearance: =TabListAppearance.Subtle
                        BasePaletteColor: =RGBA(0, 65, 179, 1)
                        Default: |-
                          ={Value: "Home"}
                        Height: =If(App.Width < 640, 48, 0)
                        Items: |-
                          =Table({Value: "Home"}, {Value: "Resources"}, {Value: "Events"}, {Value: "Gallery"})
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Parent.Width
            - HeroBandWel1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =App.Theme.Colors.Lighter70
                  FillPortions: =0
                  Height: =If(App.Width < 640, 520, 320)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =24
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(App.Width < 640, 24, 40)
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =If(App.Width < 640, 24, 40)
                  Width: =Parent.Width
                Children:
                  - HeroTextColWel1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - HeroTitleWel1:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Start
                              AutoHeight: =true
                              Color: =App.Theme.Colors.Darker20
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =If(App.Width < 640, 26, 38)
                              Text: ="Welcome to PDGo Admin Service Hub"
                              Width: =Parent.Width
            - CapabilitiesHeaderWel1:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  FontWeight: =FontWeight.Semibold
                  Height: =72
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  Size: =18
                  Text: ="Create a Ticket"
                  VerticalAlign: =VerticalAlign.Bottom
            - CapabilitiesGridWel1:
                Control: GroupContainer
                Variant: GridLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =(RoundUp(6 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0) * 168) + ((RoundUp(6 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0) - 1) * 16) + 8
                  LayoutGap: =16
                  LayoutGridColumnMinWidth: =(Parent.Width - 2 * If(App.Width < 640, 16, 40) - (If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)) - 1) * 16) / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)) - 4
                  LayoutGridColumns: =If(App.Width < 640, 1, If(App.Width < 1024, 2, 3))
                  LayoutGridRowMinHeight: =120
                  LayoutGridRows: =RoundUp(6 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =16
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =0
                  Width: =Parent.Width
                Children:
                  - CapCardWel_11:
                      Control: ModernCard
                      Properties:
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        OnSelect: =Navigate('Approval Request',ScreenTransition.Fade)
                        Subtitle: ="Hardware,Software, Access & connectivity"
                        Title: ="IT Support"
                  - CapCardWel_21:
                      Control: ModernCard
                      Properties:
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        Subtitle: ="Benefits, Payroll and People Questions"
                        Title: ="HR"
                  - CapCardWel_31:
                      Control: ModernCard
                      Properties:
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        Subtitle: ="Office Maintence,Temperature and Connectivity"
                        Title: ="Facilities"
                  - CapCardWel_41:
                      Control: ModernCard
                      Properties:
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        Subtitle: ="Expenses,Invoices and reimbursements"
                        Title: ="Finances"
                  - CapCardWel_51:
                      Control: ModernCard
                      Properties:
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        Subtitle: =
                        Title: ="Water Request"
                  - CapCardWel_61:
                      Control: ModernCard
                      Properties:
                        Image: =Blank()
                        ImagePlacement: =ImagePlacement.AfterHeader
                        LayoutDirection: =LayoutDirection.Horizontal
                        Subtitle: =
                        Title: ="Parking Request"
            - CapabilitiesHeaderWel2:
                Control: ModernText
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  FontWeight: =FontWeight.Semibold
                  Height: =72
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  Size: =18
                  Text: ="Recent Request"
                  VerticalAlign: =VerticalAlign.Bottom
            - Gallery1:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  X: =40
                  Y: =40
                Children:
                  - Title2:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Self.Size * 1.8
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =ThisItem.SampleHeading
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth - 173
                        X: =103
                        Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle2.Size * 1.8)) / 2
                  - Subtitle2:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(96, 94, 92, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Self.Size * 1.8
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =ThisItem.SampleText
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Title2.Width
                        X: =Title2.X
                        Y: =Title2.Y + Title2.Height
                  - NextArrow2:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: =Self.Tooltip
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(166, 166, 166, 1)
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        DisabledColor: =RGBA(119, 119, 119, 1)
                        Height: =50
                        Icon: =Icon.ChevronRight
                        OnSelect: =Select(Parent)
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Tooltip: ="View item details"
                        Width: =50
                        X: =Parent.TemplateWidth - Self.Width - 12
                        Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                  - Separator2:
                      Control: Rectangle
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =8
                        OnSelect: =Select(Parent)
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - Self.Height
                  - Rectangle2:
                      Control: Rectangle
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 120, 212, 1)
                        Height: =Parent.TemplateHeight - Separator2.Height
                        OnSelect: =Select(Parent)
                        Visible: =ThisItem.IsSelected
                        Width: =4
      - AccountMenu:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(255, 255, 255, 1)
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =12
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =12
            Visible: =varMenu
            Width: =240
            X: =Parent.Width - Self.Width - 16
            Y: =64
          Children:
            - menuName:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =12
                  Text: =If(IsBlank(varRole), "Not signed in", Coalesce(varUser.Title, User().FullName))
            - menuRole:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: =RGBA(96, 94, 92, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =12
                  Text: =If(IsBlank(varRole), "Sign in to see your tickets", varEmail & " · " & varRole)
            - signOut:
                Control: Classic/Button
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Font: =Font.'Segoe UI'
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(16, 110, 190, 1)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Set(varMenu, false);
                    Set(varRole, "");
                    Set(varEmail, "");
                    Navigate(Login, ScreenTransition.Fade)
                  PressedBorderColor: =RGBA(0, 69, 120, 1)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(16, 110, 190, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Text: ="Sign Out"
                  Visible: =Not(IsBlank(varRole))
            - signIn:
                Control: Classic/Button
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Font: =Font.'Segoe UI'
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(16, 110, 190, 1)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(varMenu, false); Navigate(Login, ScreenTransition.Fade)
                  PressedBorderColor: =RGBA(0, 69, 120, 1)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(16, 110, 190, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Text: ="Sign In"
                  Visible: =IsBlank(varRole)
