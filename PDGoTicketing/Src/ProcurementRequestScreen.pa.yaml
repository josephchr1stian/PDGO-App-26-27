                              "Procurement",
                              "Employee Safety",
                              "Warehouse",
                              "Administrative Support"
                          ]
                        Items.Value: =Value
                        OnChange: =Set(varShowSubmitErrors, false); Reset(ProcurementSubcategoryDropdown); Set(varResetAttachments, true); Set(varResetAttachments, false)
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedBorderColor: =RGBA(16, 110, 190, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
