      - TemplateSubmitRequestButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            Height: |
              =44
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 95, 175, 1)
            OnSelect: |-
              =Set(varShowSubmitErrors, true);

              If(
                  IsBlank(TemplateServiceCategoryDropdown.Selected.Value),
                  Notify(
                      "Please select a Service Category.",
                      NotificationType.Error
                  ),

                  IsBlank(TemplateServiceSubcategoryDropdown.Selected.Value),
                  Notify(
                      "Please select a Service Subcategory.",
                      NotificationType.Error
                  ),

                  TemplateServiceCategoryDropdown.Selected.Value = "Facilities" &&
                  TemplateServiceSubcategoryDropdown.Selected.Value = "Building Maintenance" &&
                  IsBlank(TemplateRequestTypeDropdown.Selected.Value),
                  Notify(
                      "Please select a Request Type.",
                      NotificationType.Error
                  ),

                  SubmitForm(TemplateRequestForm)
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 75, 145, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Submit Request"
            Visible: |-
              =!(
                  TemplateServiceCategoryDropdown.Selected.Value = "Facilities" &&
                  TemplateServiceSubcategoryDropdown.Selected.Value = "Parking Request" &&
                  TemplateParkingLocationDropdown.Selected.Value = "Other parking locations (free)"
              )
            Width: =180
            X: |-
              =TemplateRequestForm.X +
              (TemplateRequestForm.Width - Self.Width) / 2
            Y: =TemplateFormBackground.Y + TemplateFormBackground.Height - Self.Height - 24
