                  TemplateServiceCategoryDropdown_2.Selected.Value = "Facilities" &&
                  TemplateServiceSubcategoryDropdown_1.Selected.Value = "Parking Request" &&
                  TemplateParkingLocationDropdown_2.Selected.Value = "Other parking locations (free)"
              )
            Width: =180
            X: |-
              =TemplateRequestForm_2.X +
              (TemplateRequestForm_2.Width - Self.Width) / 2
            Y: =TemplateFormBackground_2.Y + TemplateFormBackground_2.Height - Self.Height - 24
