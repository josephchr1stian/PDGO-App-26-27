Screens:
  TicketDetailScreen:
    Properties:
      Fill: |
        =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =ViewForm(Form1)
    Children:
      - Text3:
          Control: ModernText
          Properties:
            FontWeight: =FontWeight.Bold
            Height: |
              =48
            Size: =28
            Text: |-
              =
              selTicket.ServiceSubcategory
            Width: =600
            X: =40
            Y: =80
      - Button1:
          Control: ModernButton
          Properties:
            OnSelect: |-
              =ResetForm(Form1);

              Navigate(
                  Coalesce(varPreviousScreen, UserHome), ScreenTransition.Fade
              )
            Text: ="Back"
            X: =40
            Y: =30
      - Button2:
          Control: ModernButton
          Properties:
            OnSelect: |-
              =If(
                  CanEditTicket,
                  EditForm(Form1),
                  Notify("You do not have permission to edit this ticket", NotificationType.Error)
              )
            Text: ="Edit ticket"
            Visible: =CanEditTicket && Form1.Mode = FormMode.View
            Width: =140
            X: =160
            Y: =30
      - Form1:
          Control: Form
          Variant: Modern
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            DataSource: =AdministrativeServiceRequests
            DefaultMode: =FormMode.View
            Height: =420
            Item: =selTicket
            OnFailure: |-
              =Notify (
                  Coalesce(Form1.Error, "Could not save changes."), NotificationType.Error
              )
            OnSuccess: |-
              =Set(selTicket, Form1.LastSubmit);
              ViewForm(Form1);
              Notify("Ticket updated.", NotificationType.Success)
            Width: =1100
            X: =40
            Y: =130
          Children:
            - Title_DataCard2:
                Control: TypedDataCard
                Variant: ModernTextualEdit
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  DataField: ="Title"
                  Default: =ThisItem.Title
                  DisplayName: =DataSourceInfo([@AdministrativeServiceRequests],DataSourceInfo.DisplayName,Title)
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, Title)
                  Required: =false
                  Update: =DataCardValue6.Text
                  Width: =266
                  X: =0
                  Y: =0
                Children:
                  - DataCardKey6:
                      Control: ModernText
                      MetadataKey: FieldName
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |
                          ="Category"
                        Width: =Parent.Width - 48
                        Wrap: =false
                        X: =24
                        Y: =10
                  - DataCardValue6:
                      Control: ModernTextInput
                      MetadataKey: FieldValue
                      Properties:
                        AccessibleLabel: =Parent.DisplayName
                        Default: =Parent.Default
                        DisplayMode: =Parent.DisplayMode
                        MaxLength: =Parent.MaxLength
                        Required: =Parent.Required
                        ValidationState: =If(IsBlank(Parent.Error), ValidationState.None, ValidationState.Error)
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =DataCardKey6.Y + DataCardKey6.Height + 4
                  - ErrorMessage6:
                      Control: ModernText
                      MetadataKey: ErrorMessage
                      Properties:
                        Height: =30
                        Size: =14
                        Text: =Parent.Error
                        Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =DataCardValue6.Y + DataCardValue6.Height
                  - StarVisible6:
                      Control: ModernText
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Color: =Color.Red
                        Height: =DataCardKey6.Height
                        PaddingBottom: =0
                        PaddingTop: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Y: =DataCardKey6.Y
            - Description_DataCard2:
