            Height: =40
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =18
            Text: |-
              =With({me: LookUp('Waitlist Queue', TicketID = selTicket.ID)},
                  If(
                      IsBlank(me), "Waitlist position unavailable",
                      me.QueueStatus.Value = "Offered", "A Civic Center spot has been offered to you",
                      "You're #" & (CountRows(Filter('Waitlist Queue',
                          Title = me.Title && QueueStatus.Value = "Waiting" && Created < me.Created)) + 1)
                      & " on the Civic Center waitlist."
                  )
              )
            Visible: =!IsBlank(LookUp('Waitlist Queue', TicketID = selTicket.ID && (QueueStatus.Value = "Waiting" || QueueStatus.Value = "Offered")))
            Width: =340
            X: =40
            Y: =76
      - OfferSpot:
          Control: ModernButton
          Properties:
            BasePaletteColor: =RGBA(8, 222, 8, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =38
            Icon: ="Key"
            IconStyle: =IconStyle.Filled
            OnSelect: |-
              =Patch('Waitlist Queue', LookUp('Waitlist Queue', TicketID = selTicket.ID), {QueueStatus: {Value: "Offered"}});
              Patch(AdministrativeServiceRequests, selTicket, {Status: {Value: "Offered"}});
              Set(selTicket, LookUp(AdministrativeServiceRequests, ID = selTicket.ID));
              Notify("Spot offered.", NotificationType.Success)
            Size: =12
            Text: ="Offer Spot"
            Visible: =(varRole = "Admin" || varRole = "Supervisor") && Form1_1.Mode = FormMode.View && !IsBlank(LookUp('Waitlist Queue', TicketID = selTicket.ID && QueueStatus.Value = "Waiting"))
            Width: =120
            X: =40
            Y: =627
      - AcceptSpot:
          Control: ModernButton
          Properties:
            BasePaletteColor: =RGBA(141, 229, 250, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =38
            Icon: ="Key"
            IconStyle: =IconStyle.Filled
            OnSelect: |-
              =Patch('Waitlist Queue', LookUp('Waitlist Queue', TicketID = selTicket.ID), {QueueStatus: {Value: "Done"}});
              Patch(AdministrativeServiceRequests, selTicket, {Status: {Value: "Assigned"}});
              Set(selTicket, LookUp(AdministrativeServiceRequests, ID = selTicket.ID));
              Notify("Parking assigned.", NotificationType.Success)
            Size: =12
            Text: ="Offer Spot"
            Visible: =(varRole = "Admin" || varRole = "Supervisor") && Form1_1.Mode = FormMode.View && !IsBlank(LookUp('Waitlist Queue', TicketID = selTicket.ID && QueueStatus.Value = "Offered"))
            Width: =120
            X: =40
            Y: =627
      - LeaveSpot:
          Control: ModernButton
          Properties:
            BasePaletteColor: =RGBA(249, 83, 109, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =38
            Icon: ="Dismiss"
            IconStyle: =IconStyle.Filled
            OnSelect: |-
              =Patch('Waitlist Queue', LookUp('Waitlist Queue', TicketID = selTicket.ID), {QueueStatus: {Value: "Done"}});
              Patch(AdministrativeServiceRequests, selTicket, {Status: {Value: "Declined"}});
              Set(selTicket, LookUp(AdministrativeServiceRequests, ID = selTicket.ID));
              Notify("Removed from the waitlist.", NotificationType.Success)
            Size: =12
            Text: ="Remove from waitlist"
            Visible: =(varRole = "Admin" || varRole = "Supervisor") && Form1_1.Mode = FormMode.View && !IsBlank(LookUp('Waitlist Queue', TicketID = selTicket.ID && QueueStatus.Value = "Waiting"))
            Width: =170
            X: =180
            Y: =627
