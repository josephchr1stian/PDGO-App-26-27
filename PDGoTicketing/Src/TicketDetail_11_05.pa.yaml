Screens:
  TicketDetail_11_05:
    Properties:
      Fill: |
        =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =ViewForm(Form1_1)
    Children:
      - Button1_1:
          Control: ModernButton
          Properties:
            OnSelect: |-
              =ResetForm(Form1_1);

              Navigate(
                  Coalesce(varPreviousScreen, 'Pdgo Hub 10-30-26'), ScreenTransition.Fade
              )
            Text: ="Back"
            X: =40
            Y: =30
      - Button2_1:
          Control: ModernButton
          Properties:
            OnSelect: |-
              =If(
                  CanEditTicket,
                  EditForm(Form1_1),
                  Notify("You do not have permission to edit this ticket", NotificationType.Error)
              )
            Text: ="Edit ticket"
            Visible: =CanEditTicket && Form1_1.Mode = FormMode.View
            Width: =140
            X: =160
            Y: =30
      - Text3_1:
          Control: ModernText
          Properties:
            FontWeight: =FontWeight.Bold
            Height: |
              =48
            Size: =28
            Text: |-
              =
              selTicket.ServiceSubcategory
            Width: =600
            X: =40
            Y: =138
      - Form1_1:
          Control: Form
          Variant: Modern
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            DataSource: =AdministrativeServiceRequests
            DefaultMode: =FormMode.View
            Height: =420
            Item: =selTicket
            OnFailure: |-
              =Notify (
                  Coalesce(Form1_1.Error, "Could not save changes."), NotificationType.Error
              )
            OnSuccess: |-
              =Set(selTicket, Form1_1.LastSubmit);
              ViewForm(Form1_1);
              Notify("Ticket updated.", NotificationType.Success)
            Width: =1100
            X: =40
            Y: =188
