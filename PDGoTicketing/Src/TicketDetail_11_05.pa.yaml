              ViewForm(Form1_1)
            Text: ="Cancel"
            Visible: =Form1_1.Mode = FormMode.Edit
            X: =404
            Y: =595
      - cmbReassign:
          Control: Classic/ComboBox
          Properties:
            DisplayFields: =["Email"]
            Height: =36
            InputTextPlaceholder: ="Select a supervisor or admin"
            Items: =Filter('PDGo Users', Role.Value = "Supervisor" || Role.Value = "Admin")
            SearchFields: =["Email"]
            SelectMultiple: =false
            Visible: =varRole = "Admin" && Form1_1.Mode = FormMode.View
            Width: =420
            X: =40
            Y: =678
      - btnReassign:
          Control: ModernButton
          Properties:
            DisplayMode: =If(IsBlank(cmbReassign.Selected), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Patch(AdministrativeServiceRequests, selTicket, { AssignedTo: Lower(cmbReassign.Selected.Email) });
              Set(selTicket, LookUp(AdministrativeServiceRequests, ID = selTicket.ID));
              Reset(cmbReassign);
              Notify("Ticket reassigned to " & selTicket.AssignedTo, NotificationType.Success)
            Text: ="Reassign"
            Visible: =varRole = "Admin" && Form1_1.Mode = FormMode.View
            Width: =140
            X: =480
            Y: =678
