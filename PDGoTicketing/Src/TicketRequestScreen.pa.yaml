Screens:
  TicketRequestScreen:
    Properties:
      OnVisible: |-
        =Set(varOpenTicket, Blank());
        Set(varBlink, false);
        ClearCollect(
            colAllTickets,
            ForAll(
                AdministrativeServiceRequests,
                {
                    Key: "ADM-" & ID,
                    Src: "Administrative",
                    RecId: ID,
                    Ticket: Coalesce(ServiceSubcategory, Title),
                    Desc: Description,
                    Category: Title,
                    StatusText: Status.Value,
                    Requester: RequestedBy,
                    CreatedOn: Created,
                    Cur: With(
                        {st: Lower(Trim(Coalesce(Status.Value, "submitted")))},
                        If(
                            st in ["completed", "complete", "closed", "resolved", "done", "fulfilled"], 5,
                            st in ["approved", "in progress", "assigned", "working", "scheduled"], 3,
                            2
                        )
                    )
                }
            ),
            ForAll(
                'Locksmith Requests',
                {
                    Key: "LCK-" & ID,
                    Src: "Locksmith",
                    RecId: ID,
                    Ticket: Title,
                    Desc: Description,
                    Category: RequestType,
                    StatusText: RequestStatus,
                    Requester: RequesterName,
                    CreatedOn: Created,
                    Cur: With(
                        {st: Lower(Trim(Coalesce(RequestStatus, "submitted")))},
                        If(
                            st in ["completed", "complete", "closed", "resolved", "done", "fulfilled"], 5,
                            st in ["approved", "in progress", "assigned", "working", "scheduled"], 3,
                            2
                        )
                    )
                }
            )
        )
    Children:
      - trHeaderBar:
          Control: Rectangle
          Properties:
            Fill: =RGBA(40, 134, 222, 1)
            Height: =64
            Width: =Parent.Width
      - trHeaderTitle:
          Control: Label
          Properties:
            Height: =64
            Text: ="Ticket Requests"
            Width: =400
            X: =24
      - trBackBtn:
          Control: Classic/Button
          Properties:
            Height: =36
            OnSelect: =Back()
            Text: ="Back"
            Width: =96
            X: =Parent.Width - 120
            Y: =14
      - trBlinkTimer:
          Control: Timer
          Properties:
            AutoStart: =true
            Duration: =600
            Height: =10
            OnTimerEnd: =Set(varBlink, !varBlink)
            Repeat: =true
            Visible: =false
            Width: =10
      - trListTitle:
          Control: Label
          Properties:
            Height: =32
            Text: ="My tickets (" & CountRows(Filter(AdministrativeServiceRequests, !IsBlank(varEmail) && RequestedBy = varEmail)) & ")"
            Visible: =!(App.Width < 768 && !IsBlank(varOpenTicket))
            Width: =If(IsBlank(varOpenTicket) || App.Width < 768, Parent.Width - 48, Parent.Width * 0.4 - 32)
            X: =24
            Y: =76
      - trTicketGallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            Fill: =RGBA(214, 221, 224, 1)
            Height: =Parent.Height - 128
            Items: |-
              =AddColumns(Filter(AdministrativeServiceRequests, !IsBlank(varEmail) && RequestedBy = varEmail), Key, "ADM-" & ID, Src, "Administrative", RecId, ID, Ticket, Coalesce(ServiceSubcategory, Title), Desc, Description, Category, Title, StatusText, Status.Value, Requester, RequestedBy, CreatedOn, Created, Cur, With({st: Lower(Trim(Coalesce(Status.Value, "submitted")))}, If(st in ["completed", "complete", "closed", "resolved", "done", "fulfilled"], 5, st in ["approved", "in progress", "assigned", "working", "scheduled"], 3, 2)))
            OnSelect: =If(Coalesce(varOpenTicket.Key, "") = ThisItem.Key, Set(varOpenTicket, Blank()), Set(varOpenTicket, ThisItem))
            TemplatePadding: =6
            TemplateSize: =112
            Visible: =!(App.Width < 768 && !IsBlank(varOpenTicket))
            Width: =If(IsBlank(varOpenTicket) || App.Width < 768, Parent.Width - 48, Parent.Width * 0.4 - 32)
            X: =24
            Y: =112
          Children:
            - trCardBg:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(255,255,255,1)
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
            - trCardTitle:
                Control: Label
                Properties:
                  Height: =26
                  OnSelect: =Select(Parent)
                  Text: =Coalesce(ThisItem.ServiceSubcategory, ThisItem.Title)
                  Width: =Parent.TemplateWidth - 190
                  Wrap: =false
                  X: =16
                  Y: =8
            - trCardMeta:
                Control: Label
                Properties:
                  Height: =22
                  OnSelect: =Select(Parent)
                  Text: |-
                    ="Submitted: " & Text(ThisItem.Created, "mmm d, yyyy h:mm AM/PM")
                  Width: =Parent.TemplateWidth - 32
                  Wrap: =false
                  X: =16
                  Y: =34
            - trCardStatus:
                Control: Label
                Properties:
                  Align: =Align.Right
                  Height: =26
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Status.Value
                  Width: =160
                  X: =Parent.TemplateWidth - 176
                  Y: =8
            - trCardLine1:
                Control: Rectangle
                Properties:
                  Height: =4
                  OnSelect: =Select(Parent)
                  Width: =42
                  X: =50
                  Y: =77
            - trCardStep1:
                Control: Classic/Button
                Properties:
                  Height: =34
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Text: ="1"
                  Width: =34
                  X: =16
                  Y: =62
            - trCardLine2:
                Control: Rectangle
                Properties:
                  Height: =4
                  OnSelect: =Select(Parent)
                  Width: =42
                  X: =126
                  Y: =77
            - trCardStep2:
                Control: Classic/Button
                Properties:
                  Height: =34
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Text: ="2"
                  Width: =34
                  X: =92
                  Y: =62
            - trCardLine3:
                Control: Rectangle
                Properties:
                  Height: =4
                  OnSelect: =Select(Parent)
                  Width: =42
                  X: =202
                  Y: =77
            - trCardStep3:
                Control: Classic/Button
                Properties:
                  Height: =34
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Text: ="3"
                  Width: =34
                  X: =168
                  Y: =62
            - trCardStep4:
                Control: Classic/Button
                Properties:
                  Height: =34
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Text: ="4"
                  Width: =34
                  X: =244
                  Y: =62
      - trDetailPanel:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(218, 222, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 92
            Visible: =!IsBlank(varOpenTicket)
            Width: =If(App.Width < 768, Parent.Width - 48, Parent.Width - (trTicketGallery.X + trTicketGallery.Width + 16) - 24)
            X: =If(App.Width < 768, 24, trTicketGallery.X + trTicketGallery.Width + 16)
            Y: =76
          Children:
            - trPanelTitle:
                Control: Label
                Properties:
                  Height: =32
                  Text: =varOpenTicket.Ticket
                  Width: =Parent.Width - trPanelClose.Width - 60
                  X: =24
                  Y: =16
            - trPanelSub:
                Control: Label
                Properties:
                  Height: =22
                  Text: =varOpenTicket.Src & " request  •  " & varOpenTicket.Category
                  Width: =Parent.Width - trPanelClose.Width - 60
                  X: =24
                  Y: =48
            - trPanelClose:
                Control: Classic/Button
                Properties:
                  Height: =36
                  OnSelect: =Set(varOpenTicket, Blank())
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Text: =If(App.Width < 768, "← Back", "✕")
                  Width: =If(App.Width < 768, 96, 36)
                  X: =Parent.Width - Self.Width - 20
                  Y: =16
            - trPanelDivider:
                Control: Rectangle
                Properties:
                  Height: =1
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =80
            - trLblStatus:
                Control: Label
                Properties:
                  Height: =20
                  Text: ="Status"
                  Width: =Parent.Width - 380
                  X: =24
                  Y: =96
            - trValStatus:
                Control: Label
                Properties:
                  Height: =24
                  Text: =If(varOpenTicket.Cur >= 5, "Completed", Coalesce(varOpenTicket.StatusText, "Submitted"))
                  Width: =Parent.Width - 380
                  X: =24
                  Y: =116
            - trLblRequestedby:
                Control: Label
                Properties:
                  Height: =20
                  Text: ="Requested by"
                  Width: =Parent.Width - 380
                  X: =24
                  Y: =150
            - trValRequestedby:
                Control: Label
                Properties:
                  Height: =24
                  Text: =Coalesce(varOpenTicket.Requester, "—")
                  Width: =Parent.Width - 380
                  X: =24
                  Y: =170
            - trLblSubmitted:
                Control: Label
                Properties:
                  Height: =20
                  Text: ="Submitted"
                  Width: =Parent.Width - 380
                  X: =24
                  Y: =204
            - trValSubmitted:
                Control: Label
                Properties:
                  Height: =30
                  Size: =11
                  Text: =Text(varOpenTicket.CreatedOn, "mmm d, yyyy h:mm AM/PM")
                  Width: =Parent.Width - 380
                  X: =24
                  Y: =224
            - trLblDescription:
                Control: Label
                Properties:
                  Height: =20
                  Text: ="Description"
                  Width: =Parent.Width - 380
                  X: =24
                  Y: =258
            - trValDescription:
                Control: Label
                Properties:
                  Height: =200
                  Text: =Coalesce(varOpenTicket.Desc, "No description provided.")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 380
                  X: =24
                  Y: =278
            - trFlowBg:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(245,247,250,1)
                  Height: =Parent.Height - 120
                  Width: =312
                  X: =Parent.Width - 336
                  Y: =96
            - trFlowHeader:
                Control: Label
                Properties:
                  Height: =26
                  Text: ="Approval flow"
                  Width: =280
                  X: =Parent.Width - 320
                  Y: =104
            - trFlowSub:
                Control: Label
                Properties:
                  Height: =20
                  Text: =varOpenTicket.Src & "-" & varOpenTicket.RecId & "  •  " & If(varOpenTicket.Cur >= 5, "All steps complete", "Step " & varOpenTicket.Cur & " of 4")
                  Width: =280
                  X: =Parent.Width - 320
                  Y: =128
            - trFlowGallery:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Height: =Parent.Height - Self.Y - 28
                  Items: |-
                    =With(
                        {c: varOpenTicket.Cur},
                        ForAll(
                            Sequence(4),
                            With(
                                {n: Value},
                                {
                                    Step: n,
                                    Name: Switch(n, 1, "Submitted", 2, "Review", 3, If(varOpenTicket.Src = "Locksmith", "Locksmith", "In progress"), "Done"),
                                    Role: Switch(n, 1, "Request submitted", 2, "Supervisor review", 3, "Work in progress", "Request completed"),
                                    St: If(c >= 5, "complete", n < c, "done", n = c, "current", "waiting")
                                }
                            )
                        )
                    )
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =Self.Height / 4
                  Width: =280
                  X: =Parent.Width - 320
                  Y: =160
                Children:
                  - trFlowLine:
                      Control: Rectangle
                      Properties:
                        Height: =Parent.TemplateHeight - 38
                        Visible: =ThisItem.Step < 4
                        Width: =3
                        X: =17
                        Y: =38
                  - trFlowCircle:
                      Control: Classic/Button
                      Properties:
                        Fill: =Switch(ThisItem.St, "complete", RGBA(16,124,16,1), "done", RGBA(16,124,16,1), "current", RGBA(0,90,158,1), RGBA(90,99,110,1))
                        Height: =34
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =If(ThisItem.St in ["complete", "done"], "✓", Text(ThisItem.Step))
                        Width: =34
                        X: =2
                        Y: =2
                  - trFlowName:
                      Control: Label
                      Properties:
                        Height: =22
                        Text: =ThisItem.Name
                        Width: =Parent.TemplateWidth - 56
                        X: =48
                  - trFlowRole:
                      Control: Label
                      Properties:
                        Height: =20
                        Text: =ThisItem.Role
                        Width: =Parent.TemplateWidth - 56
                        X: =48
                        Y: =20
                  - trFlowPill:
                      Control: Classic/Button
                      Properties:
                        Fill: =Switch(ThisItem.St, "complete", RGBA(16,124,16,1), "done", RGBA(16,124,16,1), "current", RGBA(0,90,158,1), RGBA(90,99,110,1))
                        Height: =28
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: =Switch(ThisItem.St, "complete", "✓ Completed", "done", "✓ Completed", "current", "● In progress", "Waiting")
                        Width: =116
                        X: =48
                        Y: =44
