Screens:
  christian req attempt:
    Properties:
      Fill: =RGBA(247, 247, 247, 1)
      ImagePosition: =ImagePosition.Tile
      OnVisible: |-
        =Set(varResetAttachments, false);
        NewForm(RequestSubmissionForm_2);
        ResetForm(RequestSubmissionForm_2)
    Children:
      - RequestHeaderBar_2:
          Control: Rectangle
          Properties:
            Fill: =RGBA(0, 81, 100, 1)
            Height: =64
            Width: =Parent.Width
      - SubmitRequestTitleLabel_2:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Text: ="Submit a Request"
            Width: =400
            X: =(Parent.Width - Self.Width) / 2
            Y: =10
      - BackToHomeButton_2:
          Control: Classic/Button
          Properties:
            Fill: =RGBA(0, 81, 100, 1)
            Height: =44
            OnSelect: =Navigate('UserHome', ScreenTransition.Fade)
            Text: ="← Back to Home"
            Width: =200
            X: =27
            Y: =85
      - RequestSubmissionForm_2:
          Control: Form
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(53, 61, 63, 1)
            BorderStyle: =BorderStyle.Dotted
            BorderThickness: =3
            DataSource: =AdministrativeServiceRequests
            DefaultMode: =FormMode.New
            Fill: =RGBA(255, 255, 255, 1)
            Height: |
              =540
            OnFailure: |
              =Notify(
                  "Submission failed: " & RequestSubmissionForm_2.Error,
                  NotificationType.Error
              )
            OnSuccess: |
              =With({who: Coalesce(LookUp('PDGo Users', Role.Value <> "User" && ServiceSubcategory = DDServiceSubcategory_2.Selected.Value, Email), LookUp('PDGo Users', Role.Value <> "User" && ServiceSubcategory = DDServiceCategory_2.Selected.Value, Email))}, Patch(AdministrativeServiceRequests, RequestSubmissionForm_2.LastSubmit, {AssignedTo: who, Status: {Value: If(IsBlank(who), "Submitted", "Assigned")}})); Notify("Your request has been submitted.", NotificationType.Success); NewForm(RequestSubmissionForm_2)   
            Width: =Min(800, Parent.Width - 48)
            X: =(Parent.Width - Self.Width) / 2
            Y: =BackToHomeButton_2.Y + BackToHomeButton_2.Height + 24
          Children:
            - Title_DataCard1_2:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                Properties:
                  DataField: ="Title"
                  Default: =ThisItem.Title
                  DisplayName: ="Service Category"
                  MaxLength: =DataSourceInfo([@AdministrativeServiceRequests], DataSourceInfo.MaxLength, Title)
                  Required: =true
                  Update: =DDServiceCategory_2.Selected.Value
                  Width: =265
                  X: =0
                  Y: =0
                Children:
                  - StarVisible1_2:
                      Control: Label
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Height: =DataCardKey1_2.Height
                        PaddingLeft: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =DataCardKey1_2.Y
                  - DataCardKey1_2:
                      Control: Label
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        Height: =34
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - DDServiceCategory_2:
                      Control: Classic/DropDown
                      Properties:
                        AllowEmptySelection: =true
                        Default: =""
                        Items: |-
                          =[
                              "Facilities",
                              "Procurement",
                              "Employee Safety",
                              "Warehouse",
                              "Administrative Support"
                          ]
                        Items.Value: =Value
                        OnChange: |-
                          =Reset(DDServiceSubcategory_2);
                          Reset(DataCardValue8_2);
                          Reset(DataCardValue9_2);
                          Reset(DataCardValue10_2);
                          Reset(DataCardValue2_2);
                          Set(varResetAttachments, true);
                          Set(varResetAttachments, false)
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =40
                  - DataCardValue1_2:
                      Control: Classic/TextInput
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Tooltip: =Parent.DisplayName
                        Visible: =false
                        Width: =Parent.Width - 60
                        X: =30
                        Y: =DataCardKey1_2.Y + DataCardKey1_2.Height + 5
                  - ErrorMessage1_2:
                      Control: Label
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
